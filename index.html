<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Research Interactives</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* ============ Tokens ============ */
:root {
  --page: #fff; --ink: #1f2a3d; --paper: #fff;
  --sky: #70C9ED; --sky-l: #E5F5FA;
  --pink: #E94B9B; --pink-l: #F8E7EF;
  --yel: #F7E477; --yel-l: #FFF3D4;
  --green: #76C76B; --green-l: #E9F3DC;
  --blue-d: #1B6F93; --pink-d: #B8306F; --green-d: #3B8A31; --violet-d: #5a3a8c;
  --line: #8a8a8a;
  --head: Orbitron, system-ui, sans-serif;
  --on-sky: #10222e; --on-yel: #2b2500;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #15181d; --ink: #eef2f6; --paper: #20252c;
    --sky: #2b6f8d; --sky-l: #1f3b48; --pink-l: #4a2438;
    --yel: #6b5f1f; --yel-l: #3f3a1f; --green-l: #2b3d27;
    --blue-d: #8fd6f2; --pink-d: #ff8fc4; --green-d: #9be08f; --violet-d: #c3a8ff; --line: #777;
    --on-sky: #eef6fa; --on-yel: #fff3d4; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #15181d; --ink: #eef2f6; --paper: #20252c;
  --sky: #2b6f8d; --sky-l: #1f3b48; --pink-l: #4a2438;
  --yel: #6b5f1f; --yel-l: #3f3a1f; --green-l: #2b3d27;
  --blue-d: #8fd6f2; --pink-d: #ff8fc4; --green-d: #9be08f; --violet-d: #c3a8ff; --line: #777;
  --on-sky: #eef6fa; --on-yel: #fff3d4; color-scheme: dark;
}

/* ============ Base ============ */
*, *::before, *::after { box-sizing: inherit; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--page); color: var(--ink); font: 12px/1.5 Nunito, system-ui, sans-serif; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--pink); outline-offset: 2px; }
.wrap { max-width: 900px; margin: 0 auto; padding-block: 0 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.fun, h2, h3 { font-family: var(--head); font-weight: 700; text-transform: uppercase; letter-spacing: .03em; }
.hidden { display: none !important; }

/* ============ Round buttons ============ */
.round { width: 24px; height: 24px; padding: 0; border-radius: 50%; border: 1.5px solid #3B8A31; background: var(--green); color: #10230d; font-size: 12px; line-height: 1; }
.round.x { border-color: #b8306f; background: var(--pink); color: #fff; font-weight: 800; }
.round:disabled { opacity: .45; cursor: default; }

/* ============ Tabs ============ */
.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; align-items: center; gap: 8px; padding: 6px max(16px, env(safe-area-inset-right, 0px)) 6px max(16px, env(safe-area-inset-left, 0px)); background: var(--sky); color: var(--on-sky); }
.tab { border: 0; background: none; padding: 3px 16px; border-radius: 99px; font: 700 12px var(--head); letter-spacing: .04em; }
.tab[aria-selected=true] { background: var(--pink); color: #fff; }
.sp { flex: 1; }

/* ============ Game cards ============ */
.games { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin: 18px 0; }
.game { padding: 10px 14px 14px; font-size: 12px; text-align: left; background: var(--yel-l); border: 2px solid var(--yel); border-radius: 12px; box-shadow: 0 3px 8px rgba(0,0,0,.15); }
.game h3 { margin: .1em 0 .4em; font-size: 1.3rem; }
.game:nth-child(1) h3 { color: var(--pink-d); }
.game:nth-child(2) h3 { color: var(--blue-d); }
.game:nth-child(3) h3 { color: var(--green-d); }
.game[aria-pressed=true] { border-color: var(--pink); box-shadow: 0 0 0 2px var(--pink), 0 3px 8px rgba(0,0,0,.15); }

/* ============ Windows ============ */
.win { margin: 20px 0; overflow: hidden; background: var(--yel-l); border-radius: 12px; box-shadow: 0 6px 14px rgba(0,0,0,.2); }
.wbar { display: flex; align-items: center; gap: 6px; padding: 6px 12px; font-size: 11px; letter-spacing: .05em; }
.win .wbar { background: var(--yel); color: var(--on-yel); }
.wbar h2 { flex: 1; margin: 0; font-size: 11px; }
.wbody { padding: 6px 16px 20px; }
.pg { margin-right: 6px; font-size: 11px; }
.pill { margin-right: 6px; padding: 1px 10px; border-radius: 99px; background: var(--sky-l); color: var(--on-sky); font-size: 11px; font-weight: 800; }
.pill.full { background: var(--pink); color: #fff; }

/* ============ Accordion ============ */
.acc { list-style: none; margin: 0; padding: 0; }
.acc > li { margin: 8px 0; }
.acc .head { display: flex; align-items: center; gap: 8px; width: 100%; padding: 2px 0; border: 0; background: none; text-align: left; }
.acc .chev { display: inline-block; font-weight: 800; color: var(--pink-d); transition: transform .2s; }
.acc [aria-expanded=true] .chev { transform: rotate(90deg); }
.acc .dot { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--ink); background: var(--paper); }
.acc .dot.done { display: grid; place-items: center; background: var(--green); border-color: var(--green-d); color: #10230d; font-size: 12px; font-weight: 800; line-height: 1; }
.acc .lbl { padding: 4px 14px; font-size: clamp(.85rem, 3.6vw, 1.25rem); color: var(--blue-d); background: var(--sky-l); border: 2px solid var(--sky); border-radius: 8px; }

.nums { display: flex; flex-wrap: wrap; gap: 8px; padding: 6px 0 6px 56px; }
.nums button { width: 38px; height: 34px; font: 700 12px var(--head); color: var(--blue-d); background: var(--sky-l); border: 2px solid var(--sky); border-radius: 8px; }
.nums button:hover { border-color: var(--pink); }
.nums button[aria-current=true] { box-shadow: 0 0 0 2px var(--paper), 0 0 0 4px var(--blue-d); }
.nums button.done { background: var(--pink); border-color: var(--pink); color: #fff; }

/* ============ Step viewer ============ */
.viewer { margin: 20px 0; overflow: hidden; background: var(--paper); border: 2px solid var(--sky); border-radius: 12px; box-shadow: 0 6px 14px rgba(0,0,0,.2); }
.viewer .wbar { background: var(--sky); color: var(--on-sky); }
.vgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 12px; }
@media (max-width: 640px) { .vgrid { grid-template-columns: 1fr; } }

.steps { max-height: min(72vh, 560px); overflow: auto; padding: 10px 14px 14px; font-size: 12px; background: var(--pink-l); border-radius: 10px; }
.steps h3 { margin: 0 0 6px; text-align: center; font-size: 1.4rem; color: var(--pink-d); }
.step { margin: 8px 0; padding: 6px 8px; border-radius: 8px; }
.step:has(input:checked) { background: var(--green-l); }
.step label { display: flex; align-items: center; gap: 8px; font: 700 12px var(--head); cursor: pointer; }
.step input { width: 16px; height: 16px; accent-color: var(--green-d); }
.step input:checked + span { text-decoration: line-through; opacity: .7; }
.step p, .step ul { margin: .4em 0 0 24px; font-size: 12px; }
.step ul { padding-left: 16px; }
.step ul ul { margin-left: 0; }

/* Writing area + tools */
.writewrap { position: relative; display: flex; }
.write { display: block; width: 100%; height: 100%; min-height: 260px; padding: 10px 48px 10px 10px; font: inherit; color: var(--ink); background: var(--paper); border: 2px solid var(--sky); border-radius: 8px; resize: vertical; }
.copybtn { position: absolute; top: 8px; right: 8px; width: 32px; height: 32px; display: grid; place-items: center; padding: 0; color: var(--blue-d); background: var(--sky-l); border: 2px solid var(--sky); border-radius: 8px; }
.copybtn:hover { border-color: var(--pink); color: var(--pink-d); }
.copybtn.done { background: var(--green); border-color: var(--green-d); color: #10230d; }
.clearbtn { top: 46px; }
.clearbtn:hover { border-color: var(--pink-d); background: var(--pink-l); color: var(--pink-d); }
.copied { position: absolute; top: 12px; right: 48px; padding: 2px 10px; background: var(--green); color: #10230d; font-weight: 800; border-radius: 99px; }

/* ============ Confirm modal ============ */
.modal { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 16px; background: rgba(0,0,0,.5); }
.mbox { width: 100%; max-width: 380px; padding: 18px 20px; background: var(--paper); color: var(--ink); border: 2px solid var(--pink); border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
.mbox h3 { margin: 0 0 8px; font-size: 1rem; color: var(--pink-d); }
.mbox p { margin: 0 0 16px; }
.mrow { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px; }

/* Course-complete pop-up */
.cong { text-align: center; }
.cong p { font-weight: 800; font-size: 14px; }
.cong .mrow { justify-content: center; }

/* ============ Quiz deck ============ */
.deck { margin: 20px 0; }
.deckhead { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.deckhead h2 { margin: 0; font-size: 1.3rem; color: var(--blue-d); }
.decks { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.decks button { padding: 8px 16px; border: 2px solid var(--sky); border-radius: 99px; background: var(--sky-l); color: var(--ink); font: 700 12px var(--head); letter-spacing: .03em; text-align: left; }
.decks button[aria-pressed=true] { background: var(--pink); border-color: var(--pink); color: #fff; }
.deck-sub { margin: 2px 0 0; opacity: .75; }
.cardsh { margin: 0 0 10px; font-size: 12px; color: var(--pink-d); }

.studybtn { padding: 10px 20px; border: 0; border-radius: 99px; background: var(--pink); color: #fff; font: 700 12px var(--head); letter-spacing: .04em; }
.studybtn:hover { filter: brightness(.95); }
.ghost { padding: 8px 18px; border: 2px solid var(--sky); border-radius: 99px; background: var(--sky-l); color: var(--ink); font: 700 12px var(--head); }

/* Deck cards (review list) */
.qcard { margin: 0 0 12px; overflow: hidden; background: var(--paper); border: 2px solid var(--sky); border-radius: 14px; }
.qh, .sh { font: 700 11px var(--head); letter-spacing: .04em; text-transform: uppercase; color: var(--pink-d); }
.qh { padding: 12px 16px 0; }
.qh + .qt { padding-top: 6px !important; }
.sh { margin: 0 0 6px; }
.qcard .qt { padding: 12px 16px; font-weight: 800; border-bottom: 1px dashed var(--sky); }
.qcard mark, .sq mark { padding: 0 3px; background: var(--green-l); color: inherit; border-radius: 4px; }
.qcard ul { list-style: none; margin: 12px; padding: 0; overflow: hidden; border: 2px solid var(--sky); border-radius: 14px; }
.qcard li { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: var(--sky-l); color: var(--ink); }
.qcard li + li { border-top: 2px solid var(--sky); }
.qcard li .ic { width: 16px; text-align: center; font-weight: 800; color: #8a96a3; }
.qcard li.ok { font-weight: 800; }
.qcard li.ok .ic { color: var(--green-d); }

/* Study mode */
.sq { padding: 16px; background: var(--paper); border: 2px solid var(--sky); border-radius: 14px; }
.sq .qt { margin: 0 0 14px; font-weight: 800; font-size: 14px; }
.sprog { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; font: 700 11px var(--head); }
.bar { flex: 1; height: 8px; overflow: hidden; background: var(--sky-l); border: 1px solid var(--sky); border-radius: 99px; }
.bar i { display: block; height: 100%; background: var(--pink); transition: width .25s; }
.opts { display: grid; gap: 8px; }
.opt { display: flex; align-items: center; gap: 10px; width: 100%; padding: 11px 14px; text-align: left; color: var(--ink); background: var(--sky-l); border: 2px solid var(--sky); border-radius: 12px; }
.opt:hover:not(:disabled) { border-color: var(--pink); }
.opt:disabled { cursor: default; }
.opt.sel { background: var(--pink-l); border-color: var(--pink); font-weight: 800; }
.opt.right { background: var(--green); border-color: var(--green-d); font-weight: 800; }
.opt.wrong { background: var(--pink-l); border-color: var(--pink); font-weight: 800; }
.sfoot { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 38px; margin-top: 14px; }
.fb { font-weight: 800; }
.fb.ok { color: var(--green-d); }
.fb.no { color: var(--pink-d); }
.score { padding: 20px 8px; text-align: center; }
.score .big { margin: 0 0 6px; font: 900 2rem var(--head); color: var(--pink-d); }
.score .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 16px; }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .acc .chev, .bar i { transition: none; }
}

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--sky); }
.steps, .qcard li, .opt, .step label { min-width: 0; overflow-wrap: anywhere; }


/* ============ Writing tab (courses) ============ */
.crumb { margin: 14px 0 6px; opacity: .75; }
.courses { display: grid; gap: 18px; margin: 10px 0 20px; }
.course { padding: 0 20px 20px; background: var(--pink-l); border-radius: 24px; text-align: center; }
.course h2 { display: inline-block; margin: 0 0 12px; padding: 8px 24px; font-size: clamp(1.1rem, 4.5vw, 1.8rem); background: var(--yel); border-radius: 0 0 20px 20px; }
.course p { max-width: 62ch; margin: 0 auto 14px; text-align: left; }
.course .go { padding: 9px 20px; border: 0; border-radius: 99px; background: var(--pink); color: #fff; font: 700 12px var(--head); letter-spacing: .04em; }
.course .go:hover { filter: brightness(.95); }
.course[data-c="0"] h2 { color: var(--pink-d); }
.course[data-c="1"] h2 { color: var(--blue-d); }
.course[data-c="2"] h2 { color: var(--green-d); }
.course[data-c="3"] h2 { color: var(--violet-d); }
</style>

<script>
/* =====================================================
   Helpers
   ===================================================== */
const $  = (s) => document.querySelector(s);
const $$ = (s) => [...document.querySelectorAll(s)];

const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const load = (key) => { try { return JSON.parse(localStorage.getItem(key) || '{}'); } catch (e) { return {}; } };
const persist = (key, value) => { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {} };

/* =====================================================
   Data
   page = [step, ...]
   step = [title, ...blocks]
   block = "paragraph" | [bullets]   (a bullet followed by an array = its sub-bullets)
   ===================================================== */
const LOREM = 'Lorem ipsum dolor sit amet, consectetur adipiscing elit sed do eiusmod tempor incididunt ut labore.';

// Placeholder pages for sections that have no content yet
const gen = (n) => Array.from({ length: n }, () => [
  ['Step title one', LOREM],
  ['Step title two', LOREM, ['Lorem ipsum dolor sit amet', 'Consectetur adipiscing elit']],
  ['Step title three', LOREM],
]);

const DATA = {
  'Introduction Writing': [
    ['Background of the Study', [
      [
        ['Define the Topic', 'Write one sentence stating the core topic and one sentence stating the boundaries (time period, population, geographic focus, or methodological scope). This acts as your compass for the rest of the section.'],
        ['Search the Literature', 'Conduct a targeted literature search using academic databases such as PubMed, Scopus, Web of Science, or Google Scholar. Focus on finding foundational studies that established key concepts, recent studies that represent the current state of knowledge, and studies that are most closely related to your specific research question.', 'Organize your sources thematically rather than chronologically. Group them by subtopic, methodology, population, or finding.'],
        ['Identify Key Themes', 'Read through your collected sources and identify what the evidence consistently shows, where findings disagree, what methodological approaches dominate, and where coverage is thin or absent. These themes become your paragraph topics.'],
      ],
      [
        ['Synthesize the Evidence', 'Synthesis means combining evidence from multiple sources to make a single point. Each paragraph should advance one theme or argument, drawing on multiple citations to support it. This demonstrates that you understand the literature as a body of evidence, not just as a collection of individual papers.'],
        ['State the Gap', 'After presenting what is known, you must clearly state what is not known. The gap is the specific piece of missing knowledge that your study will address. Effective gap statements use phrases such as “however, no study has examined,” “despite this evidence, the relationship between X and Y remains unclear,” or “existing research has focused predominantly on Z, leaving the question of W unanswered.”'],
        ['Connect to Your Purpose', 'The final paragraph of your background should transition from the gap to the purpose of your study. This connection must be explicit: “Therefore, this study aims to...” or “To address this gap, the present research examines...” The reader should feel that your study is a logical and necessary response to the gap you have just identified.'],
      ],
    ]],

    ['Rationale', [
      [
        ['Establish the Scope', 'Summarize what is reliably known, citing the strongest and most current evidence. This section exists to earn the reader’s agreement that you understand the field, not to list everything ever published on the topic — be selective and cite the work that most directly bears on the gap you’re about to name.'],

/* =====================================================
   Saved state (drafts + checked steps)
   ===================================================== */
const store  = load('drafts');
const checks = load('checks');
const saveDrafts = () => persist('drafts', store);
const saveChecks = () => persist('checks', checks);

const SECTIONS = Object.values(DATA);

/* =====================================================
   Activities accordion
   ===================================================== */
const acc = $('#acc');

Object.entries(DATA).forEach(([section, items], si) => {
  const li = document.createElement('li');
  li.innerHTML = `
    <button class="head" aria-expanded="false" aria-controls="n${si}">
      <span class="chev">›</span><span class="dot"></span><span class="lbl fun">${section}</span>
    </button>
    <div class="nums hidden" id="n${si}">
      ${items.map((it, i) => `<button title="${esc(it[0])}" data-s="${si}" data-i="${i}">${i + 1}</button>`).join('')}
    </div>`;
  acc.append(li);
});

acc.addEventListener('click', (e) => {
  const head = e.target.closest('.head');
  if (head) {
    const open = head.getAttribute('aria-expanded') === 'true';
    head.setAttribute('aria-expanded', !open);
    $('#' + head.getAttribute('aria-controls')).classList.toggle('hidden', open);
    return;
  }
  const num = e.target.closest('.nums button');
  if (num) openViewer(+num.dataset.s, +num.dataset.i);
});

$('#a-prev').onclick  = () => $$('.head[aria-expanded=true]').forEach((h) => h.click());
$('#a-close').onclick = () => { $('#activities').classList.add('hidden'); $('#viewer').classList.add('hidden'); };

/* ---------- Completion: a stage is done when every one of its steps is checked ---------- */
// All pages of a stage are shown together on one scrolling page.
const stepsOf = (s, i) => SECTIONS[s][i][1].flat();

const stageDone = (s, i) => {
  const c = checks[`${s}-${i}`] || [];
  return stepsOf(s, i).every((_, j) => c[j]);
};

const allDone = () => SECTIONS.every((sec, si) => sec.every((_, i) => stageDone(si, i)));

function updateDone() {
  $$('.nums button').forEach((b) => b.classList.toggle('done', stageDone(+b.dataset.s, +b.dataset.i)));
  $$('.acc .head .dot').forEach((dot, si) => {
    const all = SECTIONS[si].every((_, i) => stageDone(si, i));
    dot.classList.toggle('done', all);
    dot.textContent = all ? '✓' : '';
  });
}

// Migrate older per-page saves ("s-i-p") into one save per stage ("s-i")
(function migrate() {
  let changed = false;
  SECTIONS.forEach((items, s) => items.forEach((it, i) => {
    const nk = `${s}-${i}`, pages = it[1];
    if (!pages.some((_, p) => `${nk}-${p}` in store || `${nk}-${p}` in checks)) return;

    const texts = pages.map((_, p) => store[`${nk}-${p}`]).filter(Boolean);
    if (texts.length && store[nk] === undefined) store[nk] = texts.join('\n\n');

    const merged = []; let offset = 0;
    pages.forEach((steps, p) => {
      const c = checks[`${nk}-${p}`] || [];
      steps.forEach((_, j) => { merged[offset + j] = !!c[j]; });
      offset += steps.length;
    });
    if (merged.some(Boolean) && checks[nk] === undefined) checks[nk] = merged;

    pages.forEach((_, p) => { delete store[`${nk}-${p}`]; delete checks[`${nk}-${p}`]; });
    changed = true;
  }));
  if (changed) { saveDrafts(); saveChecks(); }
})();
updateDone();

/* =====================================================
   Step viewer (one stage = one scrolling page)
   ===================================================== */
let cur = { s: 0, i: 0 };

const list = (arr) =>
  `<ul>${arr.map((x, i) =>
    typeof x === 'string' ? `<li>${esc(x)}${Array.isArray(arr[i + 1]) ? list(arr[i + 1]) : ''}</li>` : ''
  ).join('')}</ul>`;

function openViewer(s, i) {
  cur = { s, i };
  render();
  $('#viewer').classList.remove('hidden');
  $('#viewer').scrollIntoView({ block: 'start' });
}

function updatePill() {
  const { s, i } = cur;
  const steps = stepsOf(s, i), c = checks[`${s}-${i}`] || [];
  const n = steps.filter((_, j) => c[j]).length;
  const pill = $('#v-done');
  pill.textContent = `${n}/${steps.length} steps`;
  pill.classList.toggle('full', n === steps.length);
}

function render() {
  const { s, i } = cur;
  const items = SECTIONS[s], key = `${s}-${i}`, steps = stepsOf(s, i);

  $$('.nums button').forEach((b) => b.setAttribute('aria-current', b.dataset.s == s && b.dataset.i == i));
  $('#v-title').textContent = `${i + 1} - ${items[i][0]}`;

  $('#steps').innerHTML = '<h3 class="fun">Steps</h3>' + steps.map((st, j) => `
    <div class="step">
      <label><input type="checkbox" data-j="${j}"${(checks[key] || [])[j] ? ' checked' : ''}><span>${esc(st[0])}</span></label>
      ${st.slice(1).map((b) => typeof b === 'string' ? `<p>${esc(b)}</p>` : list(b)).join('')}
    </div>`).join('');
  $('#steps').scrollTop = 0;

  const w = $('#write');
  w.value = store[key] || '';
  w.dataset.key = key;

  updatePill();
  $('#v-prev').disabled = i === 0;
  $('#v-next').disabled = i === items.length - 1;
}

$('#v-prev').onclick  = () => { cur.i--; render(); };
$('#v-next').onclick  = () => { cur.i++; render(); };
$('#v-close').onclick = () => $('#viewer').classList.add('hidden');

$('#steps').addEventListener('change', (e) => {
  const cb = e.target.closest('input[type=checkbox]');
  if (!cb) return;
  const key = `${cur.s}-${cur.i}`;
  const wasAll = allDone();
  (checks[key] || (checks[key] = []))[+cb.dataset.j] = cb.checked;
  saveChecks(); updateDone(); updatePill();
  if (!wasAll && allDone()) showCongrats();
});

$('#write').addEventListener('input', (e) => { store[e.target.dataset.key] = e.target.value; saveDrafts(); });

/* ---------- Copy ---------- */
const ICON_COPY = '<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>';
const ICON_OK   = '<path d="M5 12l5 5 9-10"/>';

$('#copy').onclick = async () => {
  const w = $('#write'), txt = w.value;
  if (!txt.trim()) { w.focus(); return; }
  let ok = false;
  try { await navigator.clipboard.writeText(txt); ok = true; } catch (e) {}
  if (!ok) { try { w.select(); ok = document.execCommand('copy'); w.setSelectionRange(txt.length, txt.length); } catch (e) {} }
  if (!ok) return;
  const btn = $('#copy');
  btn.classList.add('done');
  $('#copy-ic').innerHTML = ICON_OK;
  $('#copied').classList.remove('hidden');
  setTimeout(() => {
    btn.classList.remove('done');
    $('#copy-ic').innerHTML = ICON_COPY;
    $('#copied').classList.add('hidden');
  }, 1600);
};

/* ---------- Clear (with confirmation) ---------- */
let lastFocus = null;
function openConfirm() {
  if (!$('#write').value) return;
  lastFocus = document.activeElement;
  $('#confirm').classList.remove('hidden');
  $('#c-no').focus();
}
function closeConfirm() {
  $('#confirm').classList.add('hidden');
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}
$('#clear').onclick = openConfirm;
$('#c-no').onclick = closeConfirm;
$('#c-yes').onclick = () => {
  const w = $('#write');
  w.value = '';
  store[w.dataset.key] = '';
  saveDrafts(); closeConfirm(); w.focus();
};
$('#confirm').addEventListener('click', (e) => { if (e.target.id === 'confirm') closeConfirm(); });
document.addEventListener('keydown', (e) => {
  if ($('#confirm').classList.contains('hidden')) return;
  if (e.key === 'Escape') { closeConfirm(); return; }
  if (e.key === 'Tab') { // keep focus inside the dialog
    const first = $('#c-no'), last = $('#c-yes');
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});

/* =====================================================
   Quiz
   ===================================================== */
const QL = 'Characteristics of Qualitative Research';

// Q(question, options, correct index OR array of indexes for "select all", optional heading)
// **text** = highlighted. The correct answer is listed first; options are shuffled in study mode.
const Q = (q, opts, a = 0, h, fixed = false) => ({ q, opts, a, h, fixed });
// DO or DON’T card: two fixed options, doIt = true when the statement is something to DO
const DD = (stmt, doIt, h) => Q('**DO or DON’T?** ' + stmt, ['DO', 'DON’T'], doIt ? 0 : 1, h, true);

const TYPES = {

    Q('This type of research mainly focuses on gathering participants’ experiences, perceptions, and behavior.', ['Qualitative Research', 'Quantitative Research', 'Mixed Method Research']),
    Q('What question or questions does Qualitative Research answer?', ['“How?” and “Why?”', '“How?” only', '“How Many?” only', '“Why?” only', '“How Much?” only', '“How Many?” and “How Much?”']),

    Q('This characteristic of Qualitative Research enables it to be subject to inference, impressions, and an inductive form of reasoning. This identifies pattern and assumptions for a group or sample.', ['Interpretative', 'Naturalistic', 'Socially Constructed Reality', 'Emic Perspective', 'Primacy of Subject Matter', 'Reflexivity'], 0, QL),
    Q('This characteristic in Qualitative Research means the study was conducted in a field or setting where participants live, work, and play rather than an artificial or controlled environment.', ['Naturalistic', 'Reflexivity', 'Complex and Interwoven Variables', 'Interpretative', 'Naturalistic Setting', 'Primacy of Subject Matter'], 0, QL),
    Q('This characteristic emphasizes the importance of studying individuals in their natural environment to gain authentic insights into their experiences and behaviors.', ['Naturalistic Setting', 'Naturalistic', 'Primacy of Subject Matter', 'Interpretative Analysis', 'Socially Constructed Reality', 'Emic Perspective'], 0, QL),
    Q('This characteristic helps define human behaviors and experiences are complex and influenced by multiple interrelated factors that cannot be easily isolated and measured quantitatively.', ['Complex and Interwoven Variables', 'Interpretative', 'Naturalistic Setting', 'Socially Constructed Reality', 'Emic Perspective', 'Primacy of Subject Matter'], 0, QL),
    Q('This highlights the subjective nature of qualitative research given that the data gathered are non-numerical and mainly revolving on human behaviors and experiences, and that the role of researchers are necessary in explaining the collected data.', ['Interpretative Analysis', 'Reflexivity', 'Complex and Interwoven Variables', 'Interpretative', 'Naturalistic Setting', 'Socially Constructed Reality'], 0, QL),
    Q('This refers to how researchers’ own thoughts, feelings, and behaviors interact with the research site and the research itself.', ['Reflexivity', 'Naturalistic', 'Interpretative', 'Complex and Interwoven Variables', 'Emic Perspective', 'Primacy of Subject Matter'], 0, QL),
    Q('This characteristic states that the reality is subjective and is different between each individual based on their social context as it is constantly created and shared through interactions and culture.', ['Socially Constructed Reality', 'Interpretative', 'Emic Perspective', 'Complex and Interwoven Variables', 'Interpretative Analysis', 'Naturalistic Setting'], 0, QL),
    Q('This characteristic focuses and emphasizes on understanding the experiences of the individuals or participants rather than testing hypotheses and using standard statistical framework.', ['Primacy of Subject Matter', 'Emic Perspective', 'Naturalistic Setting', 'Complex and Interwoven Variables', 'Interpretative Analysis', 'Interpretative'], 0, QL),
    Q('This characteristic focuses on understanding the topic, field, or phenomenon being studied through the lens of the participants, capturing their interpretations and meanings.', ['Emic Perspective', 'Primacy of Subject Matter', 'Naturalistic Setting', 'Socially Constructed Reality', 'Complex and Interwoven Variables', 'Reflexivity'], 0, QL),

    Q('This type of research approach utilizes numerical data to present evidences and information of a study.', RES3),
    Q('It is a structured and an empirical approach that tests hypotheses and examines relationships, patterns, and trends between variables involved. What type of research approach is this?', RES3),
    Q('Which among the choices does Quantitative Research answer?', ['“How Many?” and “How Much?”', '“Why?” only', '“How Many?” only', '“How?” and “Why?”', '“How?” only', '“How Much?” only']),
    Q('As mentioned in the website, what are the three designs that the Quantitative Research can be used for? (Select all that apply.)', ['Descriptive', 'Correlational', 'Experimental', 'Phenomenological', 'Ethnographic', 'Grounded', 'Case'], [0, 1, 2]),
    Q('This type of Quantitative Research design is systematic in nature that collects, measures, and analyzes data in order to provide interpretation of what the study focuses on.', ['Descriptive Quantitative Research', 'Quantitative Correlational', 'Quantitative Experimental Research']),
    Q('It is a type of Quantitative Research design wherein researchers do not manipulate any variable involved in the study, instead, they let it naturally occur and analyzes the data collected using statistical methods.', ['Quantitative Correlational Research', 'Descriptive Quantitative Research', 'Quantitative Experimental Research']),
    Q('This states that the Quantitative Research relies heavily on factual, measurable data rather than personal opinions and interpretations.', ['Objective', 'Measurable Variables', 'Structured Standard Instruments', 'Sampling', 'Numerical Data', 'Replication'], 0, QN),
    Q('This characteristic shows what Quantitative Research must have to be able to collect data in numerical form.', ['Measurable Variables', 'Objective', 'Structured Standard Instruments', 'Sampling', 'Numerical Data', 'Replication'], 0, QN),
    Q('This states that a Quantitative Research utilizes standard measuring tools in order to gather accurate and objective results.', ['Structured Standard Instruments', 'Objective', 'Measurable Variables', 'Sampling', 'Numerical Data', 'Replication'], 0, QN),
    Q('This characteristic presents that the researchers more often gather a set of variables from a larger group for convenient study and estimate assessments and information for the whole group.', ['Sampling', 'Objective', 'Measurable Variables', 'Structured Standard Instruments', 'Numerical Data', 'Replication'], 0, QN),

    Q('This characteristic helps validate and ensure that the results would be accurate and impartial by repeated execution of study through various settings.', ['Replication', 'Objective', 'Measurable Variables', 'Structured Standard Instruments', 'Sampling', 'Numerical Data'], 0, QN),

    Q('This research type helps in creating a more definite and complete picture of a discussion of information that uses both numerical data and interpretation, aiding in providing an expanded and deep explanation for complex or varied questions.', ['Mixed Method Research', 'Qualitative Research', 'Quantitative Research']),
    Q('This type of research approach adopts a method of dealing with problems or research gaps in a more logical and realistic way that is best applicable in answering the research questions.', ['Mixed Method Research', 'Qualitative Research', 'Quantitative Research']),

    Q('This characteristic describes this approach as a help in expanding or extending the scope and depth of the study due to the different methods involved.', ['Expansion', 'Integration', 'Triangulation', 'Complementarity', 'Development', 'Initiation', 'Timing'], 0, QM),
    Q('This characteristic is necessary as it may affect the results produced due to the difference in the time the data are collected, which depends on the researchers and the necessity in fulfilling the study.', ['Timing', 'Integration', 'Triangulation', 'Complementarity', 'Development', 'Initiation', 'Expansion'], 0, QM),

const DOS = {
  title: 'Do’s and Don’ts in Research Writing',
  perfect: 'Perfect score! You know the do’s and don’ts of research writing.',
  cards: [
    // Questions coming soon
  ],
};

const DECKS = [TYPES, DOS];
let QUIZ = TYPES;

const fmt = (t) => esc(t).replace(/\*\*(.+?)\*\*/g, '<mark>$1</mark>');
const isMulti = (c) => Array.isArray(c.a);
const answersOf = (c) => (isMulti(c) ? c.a : [c.a]);
const shuffle = (arr) => {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};
let qs = { i: 0, score: 0 };

function renderDecks() {
  $('#decks').innerHTML = DECKS.map((d, k) => `<button type="button" data-k="${k}" aria-pressed="${d === QUIZ}">${esc(d.title)} (${d.cards.length})</button>`).join('');
  $$('#decks button').forEach((b) => b.onclick = () => {
    QUIZ = DECKS[+b.dataset.k];
    showStudy(false);
    renderDecks();
    renderDeck();
  });
}

function renderDeck() {
  const n = QUIZ.cards.length;
  $('#deck-title').textContent = QUIZ.title;
  $('#deck-sub').textContent = `Deck · ${n} card${n === 1 ? '' : 's'}`;
  $('#cards-h').textContent = `Cards (${n})`;
  $('#study-btn').classList.toggle('hidden', !n);
  $('#cards').innerHTML = !n ? '<p class="deck-sub">No cards in this deck yet.</p>' : QUIZ.cards.map((c) => {
    const ans = answersOf(c);
    return `
      <article class="qcard">
        ${c.h ? `<div class="qh">${esc(c.h)}</div>` : ''}
        <div class="qt">${fmt(c.q)}</div>
        <ul>${c.opts.map((o, k) => {
          const ok = ans.includes(k);
          return `<li class="${ok ? 'ok' : ''}"><span class="ic" aria-hidden="true">${ok ? '✓' : '✕'}</span><span>${esc(o)}</span></li>`;
        }).join('')}</ul>
      </article>`;
  }).join('');
}

function showStudy(on) {
  $('#materials').classList.toggle('hidden', on);
  $('#study').classList.toggle('hidden', !on);
  $('#study-btn').classList.toggle('hidden', on || !QUIZ.cards.length);
}

function startStudy() {
  if (!QUIZ.cards.length) return;
  qs = { i: 0, score: 0 };
  showStudy(true);
  renderQ();
  $('#quiz').scrollIntoView({ block: 'start' });
}

function renderQ() {
  const n = QUIZ.cards.length, box = $('#study');

  if (qs.i >= n) { // results
    box.innerHTML = `
      <div class="sq score">
        <p class="big">${qs.score}/${n}</p>
        <p>${qs.score === n ? QUIZ.perfect : 'Nice try! Review the deck and give it another go.'}</p>
        <div class="row"><button class="studybtn" id="s-retry">Try again</button><button class="ghost" id="s-back">Back to deck</button></div>
      </div>`;
    $('#s-retry').onclick = startStudy;
    $('#s-back').onclick = () => showStudy(false);
    return;
  }

  const c = QUIZ.cards[qs.i], multi = isMulti(c);
  box.innerHTML = `
    <div class="sq">
      <div class="sprog">
        <span>Question ${qs.i + 1} of ${n}</span>
        <div class="bar"><i style="width:${qs.i / n * 100}%"></i></div>
        <button class="ghost" id="s-exit">Exit</button>
      </div>
      ${c.h ? `<p class="sh">${esc(c.h)}</p>` : ''}
      <p class="qt">${fmt(c.q)}</p>
      <div class="opts">${(c.fixed ? c.opts.map((_, k) => k) : shuffle(c.opts.map((_, k) => k))).map((k) =>
        `<button class="opt" data-k="${k}"${multi ? ' aria-pressed="false"' : ''}>${esc(c.opts[k])}</button>`).join('')}</div>
      <div class="sfoot">${multi
        ? '<span class="fb">Select all that apply.</span><button class="studybtn" id="s-check">Check answer</button>'
        : '<span class="fb" id="fb"></span>'}</div>
    </div>`;

  $('#s-exit').onclick = () => showStudy(false);

  if (multi) {
    $$('#study .opt').forEach((b) => b.onclick = () => {
      const on = b.getAttribute('aria-pressed') !== 'true';
      b.setAttribute('aria-pressed', on);
      b.classList.toggle('sel', on);
    });
    $('#s-check').onclick = () => {
      const picked = $$('#study .opt[aria-pressed=true]').map((b) => +b.dataset.k);
      if (picked.length) grade(picked);
    };
  } else {
    $$('#study .opt').forEach((b) => b.onclick = () => grade([+b.dataset.k]));
  }
}

function grade(picked) {
  const c = QUIZ.cards[qs.i], ans = answersOf(c);
  const ok = picked.length === ans.length && picked.every((k) => ans.includes(k));
  if (ok) qs.score++;

  $$('#study .opt').forEach((b) => {
    const k = +b.dataset.k;
    b.disabled = true;
    b.classList.remove('sel');
    if (ans.includes(k)) b.classList.add('right');
    else if (picked.includes(k)) b.classList.add('wrong');
  });

  const last = qs.i === QUIZ.cards.length - 1;
  $('.sfoot').innerHTML = `
    <span class="fb ${ok ? 'ok' : 'no'}">${ok ? 'Correct!' : 'Not quite — the answer is ' + esc(ans.map((k) => c.opts[k]).join(', ')) + '.'}</span>
    <button class="studybtn" id="s-next">${last ? 'See results' : 'Next'}</button>`;
  $('#s-next').onclick = () => { qs.i++; renderQ(); };
  $('#s-next').focus();
}

$('#study-btn').onclick = startStudy;
renderDecks();
renderDeck();

/* =====================================================
   Tabs + game cards
   ===================================================== */
function tab(t) {
  $('#writing').classList.toggle('hidden', t !== 'writing');
  $('#interactives').classList.toggle('hidden', t !== 'interactives');
  $$('.tab').forEach((b) => b.setAttribute('aria-selected', b.dataset.t === t));
  $('#flip').textContent = t === 'writing' ? '›' : '‹';
}
$$('.tab').forEach((b) => b.onclick = () => tab(b.dataset.t));
$('#flip').onclick = () => tab($('#writing').classList.contains('hidden') ? 'writing' : 'interactives');

$$('.game').forEach((b) => b.onclick = () => {
  $$('.game').forEach((x) => x.setAttribute('aria-pressed', x === b));
  const g = b.dataset.g;
  $('#activities').classList.toggle('hidden', g !== 'activity');
  $('#quiz').classList.toggle('hidden', g !== 'quiz');
  if (g !== 'activity') $('#viewer').classList.add('hidden');
  if (g === 'quiz') showStudy(false);
});

   Writing tab: one card per paper section

   Course-complete pop-up

let congratsFocus = null;
function showCongrats() {
  congratsFocus = document.activeElement;
  $('#congrats').classList.remove('hidden');
  $('#g-ok').focus();
}

  if ($('#congrats').classList.contains('hidden')) return;
  if (e.key === 'Escape') closeCongrats();
