<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Research Interactives</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* ============ Tokens ============ */
:root {
  --page: #fff; --ink: #1f2a3d; --paper: #fff;
  --sky: #70C9ED; --sky-l: #E5F5FA;
  --pink: #E94B9B; --pink-l: #F8E7EF;
  --yel: #F7E477; --yel-l: #FFF3D4;
  --green: #76C76B; --green-l: #E9F3DC;
  --blue-d: #1B6F93; --pink-d: #B8306F; --green-d: #3B8A31; --violet-d: #5a3a8c;
  --line: #8a8a8a;
  --head: Orbitron, system-ui, sans-serif;
  --on-sky: #10222e; --on-yel: #2b2500;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #15181d; --ink: #eef2f6; --paper: #20252c;
    --sky: #2b6f8d; --sky-l: #1f3b48; --pink-l: #4a2438;
    --yel: #6b5f1f; --yel-l: #3f3a1f; --green-l: #2b3d27;
    --blue-d: #8fd6f2; --pink-d: #ff8fc4; --green-d: #9be08f; --violet-d: #c3a8ff; --line: #777;
    --on-sky: #eef6fa; --on-yel: #fff3d4; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #15181d; --ink: #eef2f6; --paper: #20252c;
  --sky: #2b6f8d; --sky-l: #1f3b48; --pink-l: #4a2438;
  --yel: #6b5f1f; --yel-l: #3f3a1f; --green-l: #2b3d27;
  --blue-d: #8fd6f2; --pink-d: #ff8fc4; --green-d: #9be08f; --violet-d: #c3a8ff; --line: #777;
  --on-sky: #eef6fa; --on-yel: #fff3d4; color-scheme: dark;
}

/* ============ Base ============ */
*, *::before, *::after { box-sizing: inherit; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--page); color: var(--ink); font: 12px/1.5 Nunito, system-ui, sans-serif; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--pink); outline-offset: 2px; }
.wrap { max-width: 900px; margin: 0 auto; padding-block: 0 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.fun, h2, h3 { font-family: var(--head); font-weight: 700; text-transform: uppercase; letter-spacing: .03em; }
.hidden { display: none !important; }

/* ============ Round buttons ============ */
.round { width: 24px; height: 24px; padding: 0; border-radius: 50%; border: 1.5px solid #3B8A31; background: var(--green); color: #10230d; font-size: 12px; line-height: 1; }
.round.x { border-color: #b8306f; background: var(--pink); color: #fff; font-weight: 800; }
.round:disabled { opacity: .45; cursor: default; }

/* ============ Tabs ============ */
.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; align-items: center; gap: 8px; padding: 6px max(16px, env(safe-area-inset-right, 0px)) 6px max(16px, env(safe-area-inset-left, 0px)); background: var(--sky); color: var(--on-sky); }
.tab { border: 0; background: none; padding: 3px 16px; border-radius: 99px; font: 700 12px var(--head); letter-spacing: .04em; }
.tab[aria-selected=true] { background: var(--pink); color: #fff; }
.sp { flex: 1; }

/* ============ Game cards ============ */
.games { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin: 18px 0; }
.game { padding: 10px 14px 14px; font-size: 12px; text-align: left; background: var(--yel-l); border: 2px solid var(--yel); border-radius: 12px; box-shadow: 0 3px 8px rgba(0,0,0,.15); }
.game h3 { margin: .1em 0 .4em; font-size: 1.3rem; }
.game:nth-child(1) h3 { color: var(--pink-d); }
.game:nth-child(2) h3 { color: var(--blue-d); }
.game:nth-child(3) h3 { color: var(--green-d); }
.game[aria-pressed=true] { border-color: var(--pink); box-shadow: 0 0 0 2px var(--pink), 0 3px 8px rgba(0,0,0,.15); }

/* ============ Windows ============ */
.win { margin: 20px 0; overflow: hidden; background: var(--yel-l); border-radius: 12px; box-shadow: 0 6px 14px rgba(0,0,0,.2); }
.wbar { display: flex; align-items: center; gap: 6px; padding: 6px 12px; font-size: 11px; letter-spacing: .05em; }
.win .wbar { background: var(--yel); color: var(--on-yel); }
.wbar h2 { flex: 1; margin: 0; font-size: 11px; }
.wbody { padding: 6px 16px 20px; }
.pg { margin-right: 6px; font-size: 11px; }
.pill { margin-right: 6px; padding: 1px 10px; border-radius: 99px; background: var(--sky-l); color: var(--on-sky); font-size: 11px; font-weight: 800; }
.pill.full { background: var(--pink); color: #fff; }

/* ============ Accordion ============ */
.acc { list-style: none; margin: 0; padding: 0; }
.acc > li { margin: 8px 0; }
.acc .head { display: flex; align-items: center; gap: 8px; width: 100%; padding: 2px 0; border: 0; background: none; text-align: left; }
.acc .chev { display: inline-block; font-weight: 800; color: var(--pink-d); transition: transform .2s; }
.acc [aria-expanded=true] .chev { transform: rotate(90deg); }
.acc .dot { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--ink); background: var(--paper); }
.acc .dot.done { display: grid; place-items: center; background: var(--green); border-color: var(--green-d); color: #10230d; font-size: 12px; font-weight: 800; line-height: 1; }
.acc .lbl { padding: 4px 14px; font-size: clamp(.85rem, 3.6vw, 1.25rem); color: var(--blue-d); background: var(--sky-l); border: 2px solid var(--sky); border-radius: 8px; }

.nums { display: flex; flex-wrap: wrap; gap: 8px; padding: 6px 0 6px 56px; }
.nums button { width: 38px; height: 34px; font: 700 12px var(--head); color: var(--blue-d); background: var(--sky-l); border: 2px solid var(--sky); border-radius: 8px; }
.nums button:hover { border-color: var(--pink); }
.nums button[aria-current=true] { box-shadow: 0 0 0 2px var(--paper), 0 0 0 4px var(--blue-d); }
.nums button.done { background: var(--pink); border-color: var(--pink); color: #fff; }

/* ============ Step viewer ============ */
.viewer { margin: 20px 0; overflow: hidden; background: var(--paper); border: 2px solid var(--sky); border-radius: 12px; box-shadow: 0 6px 14px rgba(0,0,0,.2); }
.viewer .wbar { background: var(--sky); color: var(--on-sky); }
.vgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 12px; }
@media (max-width: 640px) { .vgrid { grid-template-columns: 1fr; } }

.steps { max-height: min(72vh, 560px); overflow: auto; padding: 10px 14px 14px; font-size: 12px; background: var(--pink-l); border-radius: 10px; }
.steps h3 { margin: 0 0 6px; text-align: center; font-size: 1.4rem; color: var(--pink-d); }
.step { margin: 8px 0; padding: 6px 8px; border-radius: 8px; }
.step:has(input:checked) { background: var(--green-l); }
.step label { display: flex; align-items: center; gap: 8px; font: 700 12px var(--head); cursor: pointer; }
.step input { width: 16px; height: 16px; accent-color: var(--green-d); }
.step input:checked + span { text-decoration: line-through; opacity: .7; }
.step p, .step ul { margin: .4em 0 0 24px; font-size: 12px; }
.step ul { padding-left: 16px; }
.step ul ul { margin-left: 0; }

/* Writing area + tools */
.writewrap { position: relative; display: flex; }
.write { display: block; width: 100%; height: 100%; min-height: 260px; padding: 10px 48px 10px 10px; font: inherit; color: var(--ink); background: var(--paper); border: 2px solid var(--sky); border-radius: 8px; resize: vertical; }
.copybtn { position: absolute; top: 8px; right: 8px; width: 32px; height: 32px; display: grid; place-items: center; padding: 0; color: var(--blue-d); background: var(--sky-l); border: 2px solid var(--sky); border-radius: 8px; }
.copybtn:hover { border-color: var(--pink); color: var(--pink-d); }
.copybtn.done { background: var(--green); border-color: var(--green-d); color: #10230d; }
.clearbtn { top: 46px; }
.clearbtn:hover { border-color: var(--pink-d); background: var(--pink-l); color: var(--pink-d); }
.copied { position: absolute; top: 12px; right: 48px; padding: 2px 10px; background: var(--green); color: #10230d; font-weight: 800; border-radius: 99px; }

/* ============ Section info (from the PDF) ============ */
.info { margin: 0 0 12px; padding: 8px 12px 10px; background: var(--paper); border: 2px solid var(--sky); border-radius: 10px; overflow-wrap: anywhere; }
.info summary { cursor: pointer; font: 700 12px var(--head); letter-spacing: .04em; text-transform: uppercase; color: var(--blue-d); }
.info p, .info ul { margin: .55em 0 0; font-size: 12px; }
.info ul { padding-left: 18px; }
.info li + li { margin-top: .3em; }
.info .ih { font: 700 11px var(--head); letter-spacing: .04em; text-transform: uppercase; color: var(--pink-d); }
.info img { display: block; max-width: 100%; height: auto; margin: .7em auto 0; background: #fff; border-radius: 8px; }
.info .refs { margin-top: .8em; padding-top: .5em; border-top: 1px dashed var(--sky); }
.info .refs p { margin: .3em 0 0; padding-left: 1.5em; text-indent: -1.5em; font-size: 11px; opacity: .85; }
.info a { color: var(--blue-d); }

.learn { margin: 0 0 16px; text-align: left; }
.learn h3 { margin: 0 0 8px; text-align: center; font-size: 1rem; color: var(--pink-d); }
.learn .info { margin: 0 0 8px; }
.course .info p, .course .info ul { max-width: none; margin: .55em 0 0; text-align: left; }
.course .info ul { padding-left: 18px; }
.course .info .refs p { margin: .3em 0 0; }

/* ============ Confirm modal ============ */
.modal { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 16px; background: rgba(0,0,0,.5); }
.mbox { width: 100%; max-width: 380px; padding: 18px 20px; background: var(--paper); color: var(--ink); border: 2px solid var(--pink); border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
.mbox h3 { margin: 0 0 8px; font-size: 1rem; color: var(--pink-d); }
.mbox p { margin: 0 0 16px; }
.mrow { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px; }

/* Course-complete pop-up */
.cong { text-align: center; }
.cong p { font-weight: 800; font-size: 14px; }
.cong .mrow { justify-content: center; }

/* ============ Quiz deck ============ */
.deck { margin: 20px 0; }
.deckhead { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.deckhead h2 { margin: 0; font-size: 1.3rem; color: var(--blue-d); }
.decks { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.decks button { padding: 8px 16px; border: 2px solid var(--sky); border-radius: 99px; background: var(--sky-l); color: var(--ink); font: 700 12px var(--head); letter-spacing: .03em; text-align: left; }
.decks button[aria-pressed=true] { background: var(--pink); border-color: var(--pink); color: #fff; }
.deck-sub { margin: 2px 0 0; opacity: .75; }
.cardsh { margin: 0 0 10px; font-size: 12px; color: var(--pink-d); }

.studybtn { padding: 10px 20px; border: 0; border-radius: 99px; background: var(--pink); color: #fff; font: 700 12px var(--head); letter-spacing: .04em; }
.studybtn:hover { filter: brightness(.95); }
.ghost { padding: 8px 18px; border: 2px solid var(--sky); border-radius: 99px; background: var(--sky-l); color: var(--ink); font: 700 12px var(--head); }

/* Deck cards (review list) */
.qcard { margin: 0 0 12px; overflow: hidden; background: var(--paper); border: 2px solid var(--sky); border-radius: 14px; }
.qh, .sh { font: 700 11px var(--head); letter-spacing: .04em; text-transform: uppercase; color: var(--pink-d); }
.qh { padding: 12px 16px 0; }
.qh + .qt { padding-top: 6px !important; }
.sh { margin: 0 0 6px; }
.qcard .qt { padding: 12px 16px; font-weight: 800; border-bottom: 1px dashed var(--sky); }
.qcard mark, .sq mark { padding: 0 3px; background: var(--green-l); color: inherit; border-radius: 4px; }
.qcard ul { list-style: none; margin: 12px; padding: 0; overflow: hidden; border: 2px solid var(--sky); border-radius: 14px; }
.qcard li { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: var(--sky-l); color: var(--ink); }
.qcard li + li { border-top: 2px solid var(--sky); }
.qcard li .ic { width: 16px; text-align: center; font-weight: 800; color: #8a96a3; }
.qcard li.ok { font-weight: 800; }
.qcard li.ok .ic { color: var(--green-d); }

/* Study mode */
.sq { padding: 16px; background: var(--paper); border: 2px solid var(--sky); border-radius: 14px; }
.sq .qt { margin: 0 0 14px; font-weight: 800; font-size: 14px; }
.sprog { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; font: 700 11px var(--head); }
.bar { flex: 1; height: 8px; overflow: hidden; background: var(--sky-l); border: 1px solid var(--sky); border-radius: 99px; }
.bar i { display: block; height: 100%; background: var(--pink); transition: width .25s; }
.opts { display: grid; gap: 8px; }
.opt { display: flex; align-items: center; gap: 10px; width: 100%; padding: 11px 14px; text-align: left; color: var(--ink); background: var(--sky-l); border: 2px solid var(--sky); border-radius: 12px; }
.opt:hover:not(:disabled) { border-color: var(--pink); }
.opt:disabled { cursor: default; }
.opt.sel { background: var(--pink-l); border-color: var(--pink); font-weight: 800; }
.opt.right { background: var(--green); border-color: var(--green-d); font-weight: 800; }
.opt.wrong { background: var(--pink-l); border-color: var(--pink); font-weight: 800; }
.sfoot { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 38px; margin-top: 14px; }
.fb { font-weight: 800; }
.fb.ok { color: var(--green-d); }
.fb.no { color: var(--pink-d); }
.score { padding: 20px 8px; text-align: center; }
.score .big { margin: 0 0 6px; font: 900 2rem var(--head); color: var(--pink-d); }
.score .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 16px; }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .acc .chev, .bar i { transition: none; }
}

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--sky); }
.steps, .qcard li, .opt, .step label { min-width: 0; overflow-wrap: anywhere; }


/* ============ Writing tab (courses) ============ */
.crumb { margin: 14px 0 6px; opacity: .75; }
.courses { display: grid; gap: 18px; margin: 10px 0 20px; }
.course { padding: 0 20px 20px; background: var(--pink-l); border-radius: 24px; text-align: center; }
.course h2 { display: inline-block; margin: 0 0 12px; padding: 8px 24px; font-size: clamp(1.1rem, 4.5vw, 1.8rem); background: var(--yel); border-radius: 0 0 20px 20px; }
.course p { max-width: 62ch; margin: 0 auto 14px; text-align: left; }
.course .go { padding: 9px 20px; border: 0; border-radius: 99px; background: var(--pink); color: #fff; font: 700 12px var(--head); letter-spacing: .04em; }
.course .go:hover { filter: brightness(.95); }
.course[data-c="0"] h2 { color: var(--pink-d); }
.course[data-c="1"] h2 { color: var(--blue-d); }
.course[data-c="2"] h2 { color: var(--green-d); }
.course[data-c="3"] h2 { color: var(--violet-d); }
</style>
<!-- Tabs -->
  <div class="tabs" role="tablist">

<script>
/* =====================================================
   Helpers
   ===================================================== */
const $  = (s) => document.querySelector(s);
const $$ = (s) => [...document.querySelectorAll(s)];

const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const load = (key) => { try { return JSON.parse(localStorage.getItem(key) || '{}'); } catch (e) { return {}; } };
const persist = (key, value) => { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {} };

/* =====================================================
   Data
   page = [step, ...]
   step = [title, ...blocks]
   block = "paragraph" | [bullets]   (a bullet followed by an array = its sub-bullets)
   ===================================================== */
const LOREM = 'Lorem ipsum dolor sit amet, consectetur adipiscing elit sed do eiusmod tempor incididunt ut labore.';

// Placeholder pages for sections that have no content yet
const gen = (n) => Array.from({ length: n }, () => [
  ['Step title one', LOREM],
  ['Step title two', LOREM, ['Lorem ipsum dolor sit amet', 'Consectetur adipiscing elit']],
  ['Step title three', LOREM],
]);

const DATA = {
  'Introduction Writing': [
    ['Background of the Study', [

const INFO = { 'Introduction Writing': [{"b": ["The background of a study is the opening section of a research paper or thesis that establishes what is already known about the topic, identifies what remains unknown, and explains why the current study is needed. It provides readers with enough context to understand the research problem without requiring them to read every source the author consulted. A well-written background moves from broad context to a specific gap, setting up the research question or hypothesis that follows.", ["The background of a study establishes context, synthesizes relevant literature, identifies the research gap, and justifies the need for the current study.", "It differs from a literature review (which is comprehensive and standalone) and from an introduction (which is broader and includes the research question and objectives).", "An effective background follows a funnel structure: broad field context narrows to specific gaps and then to the study purpose.", "Synthesizing sources rather than summarizing them individually is the single most important writing technique for this section.", "Common mistakes include listing studies without connecting them, making the background too broad, and failing to state the gap explicitly."]], "ref": ["Lombard, C. (2026, September 7). How to write the background of a study: (Steps + Examples). Paperguide Blog. https://paperguide.ai/blog/write-background-of-a-study/"]}, {"b": ["It is the argument for why the study needs to exist: it names a gap in current knowledge or practice, explains why that gap matters, and states what the study will do to close it. A rationale is not a restatement of the topic (“this study looks at X”) and it is not a list of the researcher’s personal interests — it is a reasoned case, built on evidence from the existing literature, that this particular question is worth the time, money, and participant burden it will cost to answer.", "The rationale opens a study by justifying why it needs to happen; the discussion section’s implications close it by explaining what the findings actually mean once the study is done. They are structurally mirror images of each other, and a weakness in one often signals a weakness in the other — a study whose rationale overpromises tends to produce a discussion that overstates its implications to match.", ["What is already known? — the established territory, summarized from the literature.", "What is missing, wrong, or untested? — the gap, stated precisely enough that a reader could recognize it if they saw it filled.", "Why does filling it matter, and why now? — the significance: the theoretical, clinical, practical, or policy consequence of leaving the gap unaddressed."], "A rationale is not the same thing as a research question or a hypothesis — those state what will be asked or predicted; the rationale is the argument for why that question is the right one to ask. It is also not a literature review in miniature: a literature review surveys a body of work; a rationale uses a targeted slice of that same literature in service of a single argumentative claim, that this specific gap exists and matters."], "ref": ["CASRAI. (2026, August 4). The rationale of a study: what it is and how to write one. https://casrai.org/guides/rationale-of-a-study"]}, {"b": ["A literature review is a survey of scholarly sources on a specific topic. It provides an overview of current knowledge, allowing you to identify relevant theories, methods, and gaps in the existing research that you can later apply to your paper, thesis, or dissertation topic.", "The literature review gives you a chance to:", ["Demonstrate your familiarity with the topic and its scholarly context", "Develop a theoretical framework and methodology for your research", "Position your work in relation to other researchers and theorists", "Show how your research addresses a gap or contributes to a debate", "Evaluate the current state of research and demonstrate your knowledge of the scholarly debates around your topic."], "A good literature review doesn’t just summarize sources—it analyzes, synthesizes, and critically evaluates to give a clear picture of the state of knowledge on the subject."], "ref": ["McCombes, S. (2025, January 22). How to Write a Literature Review | Guide, Examples, & Templates. Scribbr. Retrieved November 5, 2026, from https://www.scribbr.com/dissertation/literature-review/"]}, {"b": ["A problem statement is a concise, evidence-based description of a specific gap or difficulty that a research study will address. It appears early in a proposal, dissertation, or journal article and answers 3 questions: what is unknown or debated, why this gap should be filled, and how the present study will address it. A problem statement does more than describe a topic. It converts a broad interest into a defensible case for action by pairing observed facts with a documented shortfall in existing knowledge.", ["A problem statement is a short, evidence-backed description of a specific gap your study will address; it is not a topic, a research question, or a hypothesis.", "Strong statements contain 5 parts: the ideal state, the actual state, supporting evidence, the consequences of inaction, and a proposed response.", "Discipline shapes emphasis: education research foregrounds learning outcomes, nursing research foregrounds patient safety, and business research foregrounds cost and competitive risk.", "Most problem statements run 150-300 words and appear in the opening pages of a proposal, in chapter 1 of a thesis, or in the final third of a journal introduction."], "A problem statement matters because it justifies the entire study: reviewers use it to judge whether the work is needed, feasible, and worth funding. A weak statement signals that the researcher has not yet found a defensible gap.", "Your problem statement performs several jobs at once:", ["Establishes significance by showing scale, cost, or risk in measurable terms", "Sets boundaries by naming the population, setting, and time frame", "Anchors the research questions, so every question traces back to a stated gap", "Guides method selection, since the nature of the gap suggests the appropriate design", "Supplies the criteria reviewers apply later when judging whether the study delivered"]], "ref": ["Rodrigues, M. (2026, September 22). How to write a problem statement in Research: Definition and examples. Educational Articles for Researchers, Students and Authors - EditageBlog. https://www.editage.com/blog/how-to-write-a-problem-statement-in-research-definition-and-examples/"]}, {"b": ["A hypothesis is a statement that can be tested by scientific research. If you want to test a relationship between two or more variables, you need to write hypotheses before you start your experiment or data collection.", "A hypothesis states your predictions about what your research will find. It is a tentative answer to your research question that has not yet been tested. For some research projects, you might have to write several hypotheses that address different aspects of your research question.", "A hypothesis is not just a guess – it should be based on existing theories and knowledge. It also has to be testable, which means you can support or refute it through scientific research methods (such as experiments, observations and statistical analysis of data). Hypotheses propose a relationship between two or more types of variables.", ["An independent variable is something the researcher changes or controls.", "A dependent variable is something the researcher observes and measures."], "If there are any control variables, extraneous variables, or confounding variables, be sure to jot those down as you go to minimize the chances that research bias will affect your results."], "ref": ["McCombes, S. (2025, January 16). How to Write a Strong Hypothesis | Steps & Examples. Scribbr. Retrieved November 4, 2026, from https://www.scribbr.com/methodology/hypothesis/"]}, {"b": ["The significance of the study is a short, persuasive passage, usually one to three paragraphs, that answers a single question your examiner is always asking: so what? It states the contribution your work makes to knowledge, practice, policy or a particular community, and it names the people or groups who stand to gain from the results. In most UK dissertations it appears near the end of Chapter 1 (Introduction), immediately after your research aims and objectives and before the structure of the dissertation.", "Crucially, the significance of the study is a forward-looking, value statement. It is not a summary of what you did, nor a list of your methods. It argues that the answers your study will produce are worth having, and it does so before you have collected a single data point. A strong significance section gives the reader a reason to keep reading and gives the examiner a clear yardstick: by the end of the thesis, did the study deliver the value it promised?", ["It justifies the time, cost and ethical burden of the research, which matters most when human participants or scarce funding are involved.", "It positions your work against the existing literature, showing that you understand the field well enough to see what is missing, which is also where a strong set of research aims takes shape.", "It guides your own decisions, because a clear sense of who benefits keeps your aims, methods and recommendations focused on real-world value."]], "ref": ["Mae, A. (2026, October 26). Significance of the study: How to write it (Examples). ResearchProspect. https://www.researchprospect.com/significance-of-the-study/"]}, {"b": ["The scope of the study is a concise statement of the extent and boundaries of your research. It answers a single question your reader is always asking: “What, exactly, is this study about — and what is it not about?” In practice, the scope sets out the parameters within which your investigation operates: the topic and research questions, the target population or sample, the geographic and temporal limits, the variables or concepts examined, and the methodological approach used to study them.", "Think of the scope as drawing a fence around your research. Everything inside the fence is what you promise to deliver and defend. Everything outside it is acknowledged as relevant but explicitly excluded, usually for reasons of time, resources, feasibility or focus. Defining that fence is not a sign of a small or weak project — it is a sign of a disciplined one. A study that claims to cover everything ends up covering nothing convincingly.", "The scope appears most often in the introduction or methodology chapter of a dissertation, and as a standalone heading in a research proposal. Examiners read it early because it frames how they will judge everything that follows: a finding that would be a weakness in a broad study can be entirely appropriate in a tightly scoped one.", {"h": "Scope vs. Delimitations vs. Limitation vs. Significance"}, "The cleanest way to remember the difference: scope is the boundary, delimitations are the choices that drew the boundary where it is, limitations are the things that weaken results despite your best efforts, and significance is the argument for why the bounded study is worth doing at all. The constraints you could not control are explored in depth in our guide to the limitations of the study; read it alongside this one so the two sections do not contradict each other.", "A complete scope statement typically addresses six dimensions. You will not always need all six, but running through the checklist ensures nothing important is left vague.", ["Topic and research questions — the precise phenomenon, concept or relationship under investigation, stated narrowly rather than broadly.", "Population and sample — who or what is being studied: the people, organisations, documents or cases, and how many.", "Geographic boundary — the location, region, institution or setting in which the research takes place.", "Time frame — the period the study covers (the years of data, or the window of data collection).", "Variables or concepts — the specific factors, themes or constructs examined, and any deliberately set aside.", "Methodology — the broad approach (qualitative, quantitative or mixed) and the type of data used, which itself bounds what the study can claim; the research methodology chapter then explains these choices in full."], "Each dimension you specify simultaneously creates a delimitation — a boundary you chose. That is why the two sections are written together. The scope says “here is the fence”; the delimitations say “here is why I put it there.”"], "ref": ["Mae, A. (2026a, June 19). Scope of the study: How to write it (+ examples). ResearchProspect. https://www.researchprospect.com/scope-of-the-study/"]}, {"b": ["The engineering design process is a series of steps that engineers follow to come up with a solution to a problem.", "Many times the solution to a problem involves designing a product (like a machine or computer code) that meets certain criteria and/or accomplishes a certain task. This process is different from the Steps of the Scientific Method, which you may be more familiar with. If your project involves making observations and doing experiments, you should probably follow the Scientific Method. If your project involves designing, building, and testing something, you should probably follow the Engineering Design Process. If you still are not sure which process to follow, you should read Comparing the Engineering Design Process and the Scientific Method.", {"img": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAeIAAAIdCAIAAABup+mlAAAACXBIWXMAAAsSAAALEgHS3X78AAAgAElEQVR42uzdd5wc1Zkv/Kdydc7d0xN6Qk/WKEtISIgooom2wWDstXHEG+6+m+zdu3d32X3f9d1rr+3rjfbuAgZjmzUYYwM2UQKBctZIk2PPTE/3dE6Vw/tHS7IMAgNGUo/m+X7mo89MT0916emqX586deoUYZomIIQQqlUklgAhhDCmEUIIYUwjhBDGNEIIIYxphBBCGNMIIYQxjRBCCGMaIYQwphFCCGFMI4QQwphGCKHFh8YS1CLThHIZUil /* =====================================================
   Saved state (drafts + checked steps)
   ===================================================== */
const store  = load('drafts');
const checks = load('checks');
const saveDrafts = () => persist('drafts', store);
const saveChecks = () => persist('checks', checks);

const SECTIONS = Object.values(DATA);

/* =====================================================
   Activities accordion
   ===================================================== */
const acc = $('#acc');

Object.entries(DATA).forEach(([section, items], si) => {
  const li = document.createElement('li');
  li.innerHTML = `
    <button class="head" aria-expanded="false" aria-controls="n${si}">
      <span class="chev">›</span><span class="dot"></span><span class="lbl fun">${section}</span>
    </button>
    <div class="nums hidden" id="n${si}">
      ${items.map((it, i) => `<button title="${esc(it[0])}" data-s="${si}" data-i="${i}">${i + 1}</button>`).join('')}
    </div>`;
  acc.append(li);
});

acc.addEventListener('click', (e) => {
  const head = e.target.closest('.head');
  if (head) {
    const open = head.getAttribute('aria-expanded') === 'true';
    head.setAttribute('aria-expanded', !open);
    $('#' + head.getAttribute('aria-controls')).classList.toggle('hidden', open);
    return;
  }
  const num = e.target.closest('.nums button');
  if (num) openViewer(+num.dataset.s, +num.dataset.i);
});

$('#a-prev').onclick  = () => $$('.head[aria-expanded=true]').forEach((h) => h.click());
$('#a-close').onclick = () => { $('#activities').classList.add('hidden'); $('#viewer').classList.add('hidden'); };

/* ---------- Completion: a stage is done when every one of its steps is checked ---------- */
// All pages of a stage are shown together on one scrolling page.
const stepsOf = (s, i) => SECTIONS[s][i][1].flat();

const stageDone = (s, i) => {
  const c = checks[`${s}-${i}`] || [];
  return stepsOf(s, i).every((_, j) => c[j]);
};

const allDone = () => SECTIONS.every((sec, si) => sec.every((_, i) => stageDone(si, i)));

function updateDone() {
  $$('.nums button').forEach((b) => b.classList.toggle('done', stageDone(+b.dataset.s, +b.dataset.i)));
  $$('.acc .head .dot').forEach((dot, si) => {
    const all = SECTIONS[si].every((_, i) => stageDone(si, i));
    dot.classList.toggle('done', all);
    dot.textContent = all ? '✓' : '';
  });
}

// Migrate older per-page saves ("s-i-p") into one save per stage ("s-i")
(function migrate() {
  let changed = false;
  SECTIONS.forEach((items, s) => items.forEach((it, i) => {
    const nk = `${s}-${i}`, pages = it[1];
    if (!pages.some((_, p) => `${nk}-${p}` in store || `${nk}-${p}` in checks)) return;

    const texts = pages.map((_, p) => store[`${nk}-${p}`]).filter(Boolean);
    if (texts.length && store[nk] === undefined) store[nk] = texts.join('\n\n');

    const merged = []; let offset = 0;
    pages.forEach((steps, p) => {
      const c = checks[`${nk}-${p}`] || [];
      steps.forEach((_, j) => { merged[offset + j] = !!c[j]; });
      offset += steps.length;
    });
    if (merged.some(Boolean) && checks[nk] === undefined) checks[nk] = merged;

    pages.forEach((_, p) => { delete store[`${nk}-${p}`]; delete checks[`${nk}-${p}`]; });
    changed = true;
  }));
  if (changed) { saveDrafts(); saveChecks(); }
})();
updateDone();

/* =====================================================
   Step viewer (one stage = one scrolling page)
   ===================================================== */
let cur = { s: 0, i: 0 };

const list = (arr) =>
  `<ul>${arr.map((x, i) =>
    typeof x === 'string' ? `<li>${esc(x)}${Array.isArray(arr[i + 1]) ? list(arr[i + 1]) : ''}</li>` : ''
  ).join('')}</ul>`;

function openViewer(s, i) {
  cur = { s, i };
  render();
  $('#viewer').classList.remove('hidden');
  $('#viewer').scrollIntoView({ block: 'start' });
}

function updatePill() {
  const { s, i } = cur;
  const steps = stepsOf(s, i), c = checks[`${s}-${i}`] || [];
  const n = steps.filter((_, j) => c[j]).length;
  const pill = $('#v-done');
  pill.textContent = `${n}/${steps.length} steps`;
  pill.classList.toggle('full', n === steps.length);
}

const linkify = (t) => esc(t).replace(/https?:\/\/[^\s<]+/g, (u) => `<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`);

function infoBody(inf) {
  const body = inf.b.map((x) =>
    typeof x === 'string' ? `<p>${esc(x)}</p>`
    : Array.isArray(x)    ? `<ul>${x.map((t) => `<li>${esc(t)}</li>`).join('')}</ul>`
    : x.img               ? `<img src="${x.img}" alt="${esc(x.alt || '')}">`
    :                       `<p class="ih">${esc(x.h)}</p>`).join('');
  return body + `<div class="refs">${inf.ref.map((r) => `<p>${linkify(r)}</p>`).join('')}</div>`;
}

// Writing tab: one collapsible reading note per Introduction section
function learnHTML() {
  const items = DATA['Introduction Writing'], info = INFO['Introduction Writing'];
  return `<div class="learn"><h3 class="fun">Read first</h3>${info.map((inf, i) =>
    `<details class="info"><summary>${i + 1} - ${esc(items[i][0])}</summary>${infoBody(inf)}</details>`).join('')}</div>`;
}

function render() {
  const { s, i } = cur;
  const items = SECTIONS[s], key = `${s}-${i}`, steps = stepsOf(s, i);

  $$('.nums button').forEach((b) => b.setAttribute('aria-current', b.dataset.s == s && b.dataset.i == i));
  $('#v-title').textContent = `${i + 1} - ${items[i][0]}`;

  $('#steps').innerHTML = '<h3 class="fun">Steps</h3>' + steps.map((st, j) => `
    <div class="step">
      <label><input type="checkbox" data-j="${j}"${(checks[key] || [])[j] ? ' checked' : ''}><span>${esc(st[0])}</span></label>
      ${st.slice(1).map((b) => typeof b === 'string' ? `<p>${esc(b)}</p>` : list(b)).join('')}
    </div>`).join('');
  $('#steps').scrollTop = 0;

  const w = $('#write');
  w.value = store[key] || '';
  w.dataset.key = key;

  updatePill();
  $('#v-prev').disabled = i === 0;
  $('#v-next').disabled = i === items.length - 1;
}

$('#v-prev').onclick  = () => { cur.i--; render(); };
$('#v-next').onclick  = () => { cur.i++; render(); };
$('#v-close').onclick = () => $('#viewer').classList.add('hidden');

$('#steps').addEventListener('change', (e) => {
  const cb = e.target.closest('input[type=checkbox]');
  if (!cb) return;
  const key = `${cur.s}-${cur.i}`;
  const wasAll = allDone();
  (checks[key] || (checks[key] = []))[+cb.dataset.j] = cb.checked;
  saveChecks(); updateDone(); updatePill();
  if (!wasAll && allDone()) showCongrats();
});

$('#write').addEventListener('input', (e) => { store[e.target.dataset.key] = e.target.value; saveDrafts(); });

/* ---------- Copy ---------- */
const ICON_COPY = '<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>';
const ICON_OK   = '<path d="M5 12l5 5 9-10"/>';

$('#copy').onclick = async () => {
  const w = $('#write'), txt = w.value;
  if (!txt.trim()) { w.focus(); return; }
  let ok = false;
  try { await navigator.clipboard.writeText(txt); ok = true; } catch (e) {}
  if (!ok) { try { w.select(); ok = document.execCommand('copy'); w.setSelectionRange(txt.length, txt.length); } catch (e) {} }
  if (!ok) return;
  const btn = $('#copy');
  btn.classList.add('done');
  $('#copy-ic').innerHTML = ICON_OK;
  $('#copied').classList.remove('hidden');
  setTimeout(() => {
    btn.classList.remove('done');
    $('#copy-ic').innerHTML = ICON_COPY;
    $('#copied').classList.add('hidden');
  }, 1600);
};

/* ---------- Clear (with confirmation) ---------- */
let lastFocus = null;
function openConfirm() {
  if (!$('#write').value) return;
  lastFocus = document.activeElement;
  $('#confirm').classList.remove('hidden');
  $('#c-no').focus();
}
function closeConfirm() {
  $('#confirm').classList.add('hidden');
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}
$('#clear').onclick = openConfirm;
$('#c-no').onclick = closeConfirm;
$('#c-yes').onclick = () => {
  const w = $('#write');
  w.value = '';
  store[w.dataset.key] = '';
  saveDrafts(); closeConfirm(); w.focus();
};
$('#confirm').addEventListener('click', (e) => { if (e.target.id === 'confirm') closeConfirm(); });
document.addEventListener('keydown', (e) => {
  if ($('#confirm').classList.contains('hidden')) return;
  if (e.key === 'Escape') { closeConfirm(); return; }
  if (e.key === 'Tab') { // keep focus inside the dialog
    const first = $('#c-no'), last = $('#c-yes');
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});

    Q('This characteristic describes this approach as a help in expanding or extending the scope and depth of the study due to the different methods involved.', ['Expansion', 'Integration', 'Triangulation', 'Complementarity', 'Development', 'Initiation', 'Timing'], 0, QM),
    Q('This characteristic is necessary as it may affect the results produced due to the difference in the time the data are collected, which depends on the researchers and the necessity in fulfilling the study.', ['Timing', 'Integration', 'Triangulation', 'Complementarity', 'Development', 'Initiation', 'Expansion'], 0, QM),
  ],
};

const DECKS = [TYPES, DOS];
let QUIZ = TYPES;

const fmt = (t) => esc(t).replace(/\*\*(.+?)\*\*/g, '<mark>$1</mark>');
const isMulti = (c) => Array.isArray(c.a);
const answersOf = (c) => (isMulti(c) ? c.a : [c.a]);
const shuffle = (arr) => {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};
let qs = { i: 0, score: 0 };

function renderDecks() {
  $('#decks').innerHTML = DECKS.map((d, k) => `<button type="button" data-k="${k}" aria-pressed="${d === QUIZ}">${esc(d.title)} (${d.cards.length})</button>`).join('');
  $$('#decks button').forEach((b) => b.onclick = () => {
    QUIZ = DECKS[+b.dataset.k];
    showStudy(false);
    renderDecks();
    renderDeck();
  });
}

function renderDeck() {
  const n = QUIZ.cards.length;
  $('#deck-title').textContent = QUIZ.title;
  $('#deck-sub').textContent = `Deck · ${n} card${n === 1 ? '' : 's'}`;
  $('#cards-h').textContent = `Cards (${n})`;
  $('#study-btn').classList.toggle('hidden', !n);
  $('#cards').innerHTML = !n ? '<p class="deck-sub">No cards in this deck yet.</p>' : QUIZ.cards.map((c) => {
    const ans = answersOf(c);
    return `
      <article class="qcard">
        ${c.h ? `<div class="qh">${esc(c.h)}</div>` : ''}
        <div class="qt">${fmt(c.q)}</div>
        <ul>${c.opts.map((o, k) => {
          const ok = ans.includes(k);
          return `<li class="${ok ? 'ok' : ''}"><span class="ic" aria-hidden="true">${ok ? '✓' : '✕'}</span><span>${esc(o)}</span></li>`;
        }).join('')}</ul>
      </article>`;
  }).join('');
}

function showStudy(on) {
  $('#materials').classList.toggle('hidden', on);
  $('#study').classList.toggle('hidden', !on);
  $('#study-btn').classList.toggle('hidden', on || !QUIZ.cards.length);
}

function startStudy() {
  if (!QUIZ.cards.length) return;
  qs = { i: 0, score: 0 };
  showStudy(true);
  renderQ();
  $('#quiz').scrollIntoView({ block: 'start' });
}

function renderQ() {
  const n = QUIZ.cards.length, box = $('#study');

  if (qs.i >= n) { // results
    box.innerHTML = `
      <div class="sq score">
        <p class="big">${qs.score}/${n}</p>
        <p>${qs.score === n ? QUIZ.perfect : 'Nice try! Review the deck and give it another go.'}</p>
        <div class="row"><button class="studybtn" id="s-retry">Try again</button><button class="ghost" id="s-back">Back to deck</button></div>
      </div>`;
    $('#s-retry').onclick = startStudy;
    $('#s-back').onclick = () => showStudy(false);
    return;
  }

  const c = QUIZ.cards[qs.i], multi = isMulti(c);
  box.innerHTML = `
    <div class="sq">
      <div class="sprog">
        <span>Question ${qs.i + 1} of ${n}</span>
        <div class="bar"><i style="width:${qs.i / n * 100}%"></i></div>
        <button class="ghost" id="s-exit">Exit</button>
      </div>
      ${c.h ? `<p class="sh">${esc(c.h)}</p>` : ''}
      <p class="qt">${fmt(c.q)}</p>
      <div class="opts">${(c.fixed ? c.opts.map((_, k) => k) : shuffle(c.opts.map((_, k) => k))).map((k) =>
        `<button class="opt" data-k="${k}"${multi ? ' aria-pressed="false"' : ''}>${esc(c.opts[k])}</button>`).join('')}</div>
      <div class="sfoot">${multi
        ? '<span class="fb">Select all that apply.</span><button class="studybtn" id="s-check">Check answer</button>'
        : '<span class="fb" id="fb"></span>'}</div>
    </div>`;

  $('#s-exit').onclick = () => showStudy(false);

  if (multi) {
    $$('#study .opt').forEach((b) => b.onclick = () => {
      const on = b.getAttribute('aria-pressed') !== 'true';
      b.setAttribute('aria-pressed', on);
      b.classList.toggle('sel', on);
    });
    $('#s-check').onclick = () => {
      const picked = $$('#study .opt[aria-pressed=true]').map((b) => +b.dataset.k);
      if (picked.length) grade(picked);
    };
  } else {
    $$('#study .opt').forEach((b) => b.onclick = () => grade([+b.dataset.k]));
  }
}

function grade(picked) {
  const c = QUIZ.cards[qs.i], ans = answersOf(c);
  const ok = picked.length === ans.length && picked.every((k) => ans.includes(k));
  if (ok) qs.score++;

  $$('#study .opt').forEach((b) => {
    const k = +b.dataset.k;
    b.disabled = true;
    b.classList.remove('sel');
    if (ans.includes(k)) b.classList.add('right');
    else if (picked.includes(k)) b.classList.add('wrong');
  });

  const last = qs.i === QUIZ.cards.length - 1;
  $('.sfoot').innerHTML = `
    <span class="fb ${ok ? 'ok' : 'no'}">${ok ? 'Correct!' : 'Not quite — the answer is ' + esc(ans.map((k) => c.opts[k]).join(', ')) + '.'}</span>
    <button class="studybtn" id="s-next">${last ? 'See results' : 'Next'}</button>`;
  $('#s-next').onclick = () => { qs.i++; renderQ(); };
  $('#s-next').focus();
}

$('#study-btn').onclick = startStudy;
renderDecks();
renderDeck();

/* =====================================================
   Tabs + game cards
   ===================================================== */
function tab(t) {
  $('#writing').classList.toggle('hidden', t !== 'writing');
  $('#interactives').classList.toggle('hidden', t !== 'interactives');
  $$('.tab').forEach((b) => b.setAttribute('aria-selected', b.dataset.t === t));
  $('#flip').textContent = t === 'writing' ? '›' : '‹';
}
$$('.tab').forEach((b) => b.onclick = () => tab(b.dataset.t));
$('#flip').onclick = () => tab($('#writing').classList.contains('hidden') ? 'writing' : 'interactives');

$$('.game').forEach((b) => b.onclick = () => {
  $$('.game').forEach((x) => x.setAttribute('aria-pressed', x === b));
  const g = b.dataset.g;
  $('#activities').classList.toggle('hidden', g !== 'activity');
  $('#quiz').classList.toggle('hidden', g !== 'quiz');
  if (g !== 'activity') $('#viewer').classList.add('hidden');
  if (g === 'quiz') showStudy(false);
});


/* =====================================================
   Writing tab: one card per paper section
   ===================================================== */
const COURSES = [
  ['Introduction', 'Set up your study. Explain the background, the problem, your hypothesis and why the research matters, from Background of the Study to Definition of Terms.'],
  ['Methodology', 'Describe how you will carry out the study: your input-process-output framework, materials, procedures, testing and statistical treatment.'],
  ['Results', 'Present what you found. Choose between text, tables and figures, and present your data clearly with the right graph types and labels.'],
  ['Discussion', 'Wrap up your paper. Write your conclusion, summarize your findings, give recommendations, and finish with the bibliography, acknowledgement and appendix.'],
];

$('#courses').innerHTML = COURSES.map(([name, text], i) => `
  <article class="course" data-c="${i}">
    <h2 class="fun">${esc(name)}</h2>
    <p>${esc(text)}</p>
    ${i === 0 ? learnHTML() : ''}
    <button class="go" type="button" data-c="${i}">Start writing</button>
  </article>`).join('');

$('#courses').addEventListener('click', (e) => {
  const btn = e.target.closest('.go');
  if (!btn) return;
  const si = +btn.dataset.c;
  tab('interactives');
  $('.game[data-g="activity"]').click();
  const head = $$('.acc .head')[si];
  if (head.getAttribute('aria-expanded') !== 'true') head.click();
  head.scrollIntoView({ block: 'start' });
});

/* =====================================================
   Course-complete pop-up
   ===================================================== */
let congratsFocus = null;
function showCongrats() {
  congratsFocus = document.activeElement;
  $('#congrats').classList.remove('hidden');
  $('#g-ok').focus();
}
function closeCongrats() {
  $('#congrats').classList.add('hidden');
  if (congratsFocus && congratsFocus.focus) congratsFocus.focus();
}
$('#g-ok').onclick = closeCongrats;
$('#congrats').addEventListener('click', (e) => { if (e.target.id === 'congrats') closeCongrats(); });
document.addEventListener('keydown', (e) => {
  if ($('#congrats').classList.contains('hidden')) return;
  if (e.key === 'Escape') closeCongrats();
  if (e.key === 'Tab') { e.preventDefault(); $('#g-ok').focus(); }
});
</script>
