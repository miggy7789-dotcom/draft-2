<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Research Interactives</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* ============ Tokens ============ */
:root {
  --page: #fff; --ink: #1f2a3d; --paper: #fff;
  --sky: #70C9ED; --sky-l: #E5F5FA;
  --pink: #E94B9B; --pink-l: #F8E7EF;
  --yel: #F7E477; --yel-l: #FFF3D4;
  --green: #76C76B; --green-l: #E9F3DC;
  --blue-d: #1B6F93; --pink-d: #B8306F; --green-d: #3B8A31; --violet-d: #5a3a8c;
  --line: #8a8a8a;
  --head: Orbitron, system-ui, sans-serif;
  --on-sky: #10222e; --on-yel: #2b2500;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #15181d; --ink: #eef2f6; --paper: #20252c;
    --sky: #2b6f8d; --sky-l: #1f3b48; --pink-l: #4a2438;
    --yel: #6b5f1f; --yel-l: #3f3a1f; --green-l: #2b3d27;
    --blue-d: #8fd6f2; --pink-d: #ff8fc4; --green-d: #9be08f; --violet-d: #c3a8ff; --line: #777;
    --on-sky: #eef6fa; --on-yel: #fff3d4; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #15181d; --ink: #eef2f6; --paper: #20252c;
  --sky: #2b6f8d; --sky-l: #1f3b48; --pink-l: #4a2438;
  --yel: #6b5f1f; --yel-l: #3f3a1f; --green-l: #2b3d27;
  --blue-d: #8fd6f2; --pink-d: #ff8fc4; --green-d: #9be08f; --violet-d: #c3a8ff; --line: #777;
  --on-sky: #eef6fa; --on-yel: #fff3d4; color-scheme: dark;
}

/* ============ Base ============ */
*, *::before, *::after { box-sizing: inherit; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--page); color: var(--ink); font: 12px/1.5 Nunito, system-ui, sans-serif; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--pink); outline-offset: 2px; }
.wrap { max-width: 900px; margin: 0 auto; padding-block: 0 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.fun, h2, h3 { font-family: var(--head); font-weight: 700; text-transform: uppercase; letter-spacing: .03em; }
.hidden { display: none !important; }

/* ============ Round buttons ============ */
.round { width: 24px; height: 24px; padding: 0; border-radius: 50%; border: 1.5px solid #3B8A31; background: var(--green); color: #10230d; font-size: 12px; line-height: 1; }
.round.x { border-color: #b8306f; background: var(--pink); color: #fff; font-weight: 800; }
.round:disabled { opacity: .45; cursor: default; }

/* ============ Tabs ============ */
.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; align-items: center; gap: 8px; padding: 6px max(16px, env(safe-area-inset-right, 0px)) 6px max(16px, env(safe-area-inset-left, 0px)); background: var(--sky); color: var(--on-sky); }
.tab { border: 0; background: none; padding: 3px 16px; border-radius: 99px; font: 700 12px var(--head); letter-spacing: .04em; }
.tab[aria-selected=true] { background: var(--pink); color: #fff; }
.sp { flex: 1; }

/* ============ Game cards ============ */
.games { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin: 18px 0; }
.game { padding: 10px 14px 14px; font-size: 12px; text-align: left; background: var(--yel-l); border: 2px solid var(--yel); border-radius: 12px; box-shadow: 0 3px 8px rgba(0,0,0,.15); }
.game h3 { margin: .1em 0 .4em; font-size: 1.3rem; }
.game:nth-child(1) h3 { color: var(--pink-d); }
.game:nth-child(2) h3 { color: var(--blue-d); }
.game:nth-child(3) h3 { color: var(--green-d); }
.game[aria-pressed=true] { border-color: var(--pink); box-shadow: 0 0 0 2px var(--pink), 0 3px 8px rgba(0,0,0,.15); }

/* ============ Windows ============ */
.win { margin: 20px 0; overflow: hidden; background: var(--yel-l); border-radius: 12px; box-shadow: 0 6px 14px rgba(0,0,0,.2); }
.wbar { display: flex; align-items: center; gap: 6px; padding: 6px 12px; font-size: 11px; letter-spacing: .05em; }
.win .wbar { background: var(--yel); color: var(--on-yel); }
.wbar h2 { flex: 1; margin: 0; font-size: 11px; }
.wbody { padding: 6px 16px 20px; }
.pg { margin-right: 6px; font-size: 11px; }
.pill { margin-right: 6px; padding: 1px 10px; border-radius: 99px; background: var(--sky-l); color: var(--on-sky); font-size: 11px; font-weight: 800; }
.pill.full { background: var(--pink); color: #fff; }

/* ============ Accordion ============ */
.acc { list-style: none; margin: 0; padding: 0; }
.acc > li { margin: 8px 0; }
.acc .head { display: flex; align-items: center; gap: 8px; width: 100%; padding: 2px 0; border: 0; background: none; text-align: left; }
.acc .chev { display: inline-block; font-weight: 800; color: var(--pink-d); transition: transform .2s; }
.acc [aria-expanded=true] .chev { transform: rotate(90deg); }
.acc .dot { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--ink); background: var(--paper); }
.acc .dot.done { display: grid; place-items: center; background: var(--green); border-color: var(--green-d); color: #10230d; font-size: 12px; font-weight: 800; line-height: 1; }
.acc .lbl { padding: 4px 14px; font-size: clamp(.85rem, 3.6vw, 1.25rem); color: var(--blue-d); background: var(--sky-l); border: 2px solid var(--sky); border-radius: 8px; }

.nums { display: flex; flex-wrap: wrap; gap: 8px; padding: 6px 0 6px 56px; }
.nums button { width: 38px; height: 34px; font: 700 12px var(--head); color: var(--blue-d); background: var(--sky-l); border: 2px solid var(--sky); border-radius: 8px; }
.nums button:hover { border-color: var(--pink); }
.nums button[aria-current=true] { box-shadow: 0 0 0 2px var(--paper), 0 0 0 4px var(--blue-d); }
.nums button.done { background: var(--pink); border-color: var(--pink); color: #fff; }

/* ============ Step viewer ============ */
.viewer { margin: 20px 0; overflow: hidden; background: var(--paper); border: 2px solid var(--sky); border-radius: 12px; box-shadow: 0 6px 14px rgba(0,0,0,.2); }
.viewer .wbar { background: var(--sky); color: var(--on-sky); }
.vgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 12px; }
@media (max-width: 640px) { .vgrid { grid-template-columns: 1fr; } }

.steps { max-height: min(72vh, 560px); overflow: auto; padding: 10px 14px 14px; font-size: 12px; background: var(--pink-l); border-radius: 10px; }
.steps h3 { margin: 0 0 6px; text-align: center; font-size: 1.4rem; color: var(--pink-d); }
.step { margin: 8px 0; padding: 6px 8px; border-radius: 8px; }
.step:has(input:checked) { background: var(--green-l); }
.step label { display: flex; align-items: center; gap: 8px; font: 700 12px var(--head); cursor: pointer; }
.step input { width: 16px; height: 16px; accent-color: var(--green-d); }
.step input:checked + span { text-decoration: line-through; opacity: .7; }
.step p, .step ul { margin: .4em 0 0 24px; font-size: 12px; }
.step ul { padding-left: 16px; }
.step ul ul { margin-left: 0; }

/* Writing area + tools */
.writewrap { position: relative; display: flex; }
.write { display: block; width: 100%; height: 100%; min-height: 260px; padding: 10px 48px 10px 10px; font: inherit; color: var(--ink); background: var(--paper); border: 2px solid var(--sky); border-radius: 8px; resize: vertical; }
.copybtn { position: absolute; top: 8px; right: 8px; width: 32px; height: 32px; display: grid; place-items: center; padding: 0; color: var(--blue-d); background: var(--sky-l); border: 2px solid var(--sky); border-radius: 8px; }
.copybtn:hover { border-color: var(--pink); color: var(--pink-d); }
.copybtn.done { background: var(--green); border-color: var(--green-d); color: #10230d; }
.clearbtn { top: 46px; }
.clearbtn:hover { border-color: var(--pink-d); background: var(--pink-l); color: var(--pink-d); }
.copied { position: absolute; top: 12px; right: 48px; padding: 2px 10px; background: var(--green); color: #10230d; font-weight: 800; border-radius: 99px; }

/* ============ Section info (from the PDF) ============ */
.info { margin: 0 0 12px; padding: 8px 12px 10px; background: var(--paper); border: 2px solid var(--sky); border-radius: 10px; overflow-wrap: anywhere; }
.info summary { cursor: pointer; font: 700 12px var(--head); letter-spacing: .04em; text-transform: uppercase; color: var(--blue-d); }
.info p, .info ul { margin: .55em 0 0; font-size: 12px; }
.info ul { padding-left: 18px; }
.info li + li { margin-top: .3em; }
.info .ih { font: 700 11px var(--head); letter-spacing: .04em; text-transform: uppercase; color: var(--pink-d); }
.info img { display: block; max-width: 100%; height: auto; margin: .7em auto 0; background: #fff; border-radius: 8px; }
.info .refs { margin-top: .8em; padding-top: .5em; border-top: 1px dashed var(--sky); }
.info .refs p { margin: .3em 0 0; padding-left: 1.5em; text-indent: -1.5em; font-size: 11px; opacity: .85; }
.info a { color: var(--blue-d); }

.learn { margin: 0 0 16px; text-align: left; }
.learn h3 { margin: 0 0 8px; text-align: center; font-size: 1rem; color: var(--pink-d); }
.learn .info { margin: 0 0 8px; }
.course .info p, .course .info ul { max-width: none; margin: .55em 0 0; text-align: left; }
.course .info ul { padding-left: 18px; }
.course .info .refs p { margin: .3em 0 0; }

.info .ex { margin-top: .9em; padding: 4px 10px 10px; border-left: 4px solid var(--pink-d); background: var(--pink-l); border-radius: 6px; }
.info .ex > .ih:first-child { margin-top: .6em; }
.info .tbl { overflow-x: auto; margin: .4em 0 0; }
.info table { border-collapse: collapse; width: 100%; font-size: 12px; background: var(--paper); }
.info th, .info td { border: 1px solid var(--sky); padding: 4px 8px; text-align: center; }
.info th { background: var(--sky); color: var(--on-sky); }
.info .cap { font-weight: 700; font-size: 11px; margin: .7em 0 0; }
.info .ex .refs { margin-top: .4em; padding-top: 0; border-top: 0; }
.info .ex .refs p { margin: .5em 0 0; }

/* ============ Confirm modal ============ */
.modal { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 16px; background: rgba(0,0,0,.5); }
.mbox { width: 100%; max-width: 380px; padding: 18px 20px; background: var(--paper); color: var(--ink); border: 2px solid var(--pink); border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
.mbox h3 { margin: 0 0 8px; font-size: 1rem; color: var(--pink-d); }
.mbox p { margin: 0 0 16px; }
.mrow { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px; }

/* Course-complete pop-up */
.cong { text-align: center; }
.cong p { font-weight: 800; font-size: 14px; }
.cong .mrow { justify-content: center; }

/* ============ Quiz deck ============ */
.deck { margin: 20px 0; }
.deckhead { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.deckhead h2 { margin: 0; font-size: 1.3rem; color: var(--blue-d); }
.decks { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.decks button { padding: 8px 16px; border: 2px solid var(--sky); border-radius: 99px; background: var(--sky-l); color: var(--ink); font: 700 12px var(--head); letter-spacing: .03em; text-align: left; }
.decks button[aria-pressed=true] { background: var(--pink); border-color: var(--pink); color: #fff; }
.deck-sub { margin: 2px 0 0; opacity: .75; }
.cardsh { margin: 0 0 10px; font-size: 12px; color: var(--pink-d); }

.studybtn { padding: 10px 20px; border: 0; border-radius: 99px; background: var(--pink); color: #fff; font: 700 12px var(--head); letter-spacing: .04em; }
.studybtn:hover { filter: brightness(.95); }
.ghost { padding: 8px 18px; border: 2px solid var(--sky); border-radius: 99px; background: var(--sky-l); color: var(--ink); font: 700 12px var(--head); }

/* Deck cards (review list) */
.qcard { margin: 0 0 12px; overflow: hidden; background: var(--paper); border: 2px solid var(--sky); border-radius: 14px; }
.qh, .sh { font: 700 11px var(--head); letter-spacing: .04em; text-transform: uppercase; color: var(--pink-d); }
.qh { padding: 12px 16px 0; }
.qh + .qt { padding-top: 6px !important; }
.sh { margin: 0 0 6px; }
.qcard .qt { padding: 12px 16px; font-weight: 800; border-bottom: 1px dashed var(--sky); }
.qcard mark, .sq mark { padding: 0 3px; background: var(--green-l); color: inherit; border-radius: 4px; }
.qcard ul { list-style: none; margin: 12px; padding: 0; overflow: hidden; border: 2px solid var(--sky); border-radius: 14px; }
.qcard li { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: var(--sky-l); color: var(--ink); }
.qcard li + li { border-top: 2px solid var(--sky); }
.qcard li .ic { width: 16px; text-align: center; font-weight: 800; color: #8a96a3; }
.qcard li.ok { font-weight: 800; }
.qcard li.ok .ic { color: var(--green-d); }

/* Study mode */
.sq { padding: 16px; background: var(--paper); border: 2px solid var(--sky); border-radius: 14px; }
.sq .qt { margin: 0 0 14px; font-weight: 800; font-size: 14px; }
.sprog { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; font: 700 11px var(--head); }
.bar { flex: 1; height: 8px; overflow: hidden; background: var(--sky-l); border: 1px solid var(--sky); border-radius: 99px; }
.bar i { display: block; height: 100%; background: var(--pink); transition: width .25s; }
.opts { display: grid; gap: 8px; }
.opt { display: flex; align-items: center; gap: 10px; width: 100%; padding: 11px 14px; text-align: left; color: var(--ink); background: var(--sky-l); border: 2px solid var(--sky); border-radius: 12px; }
.opt:hover:not(:disabled) { border-color: var(--pink); }
.opt:disabled { cursor: default; }
.opt.sel { background: var(--pink-l); border-color: var(--pink); font-weight: 800; }
.opt.right { background: var(--green); border-color: var(--green-d); font-weight: 800; }
.opt.wrong { background: var(--pink-l); border-color: var(--pink); font-weight: 800; }
.sfoot { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 38px; margin-top: 14px; }
.fb { font-weight: 800; }
.fb.ok { color: var(--green-d); }
.fb.no { color: var(--pink-d); }
.score { padding: 20px 8px; text-align: center; }
.score .big { margin: 0 0 6px; font: 900 2rem var(--head); color: var(--pink-d); }
.score .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 16px; }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .acc .chev, .bar i { transition: none; }
}

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--sky); }
.steps, .qcard li, .opt, .step label { min-width: 0; overflow-wrap: anywhere; }


/* ============ Writing tab (courses) ============ */
.crumb { margin: 14px 0 6px; opacity: .75; }
.courses { display: grid; gap: 18px; margin: 10px 0 20px; }
.course { padding: 0 20px 20px; background: var(--pink-l); border-radius: 24px; text-align: center; }
.course h2 { display: inline-block; margin: 0 0 12px; padding: 8px 24px; font-size: clamp(1.1rem, 4.5vw, 1.8rem); background: var(--yel); border-radius: 0 0 20px 20px; }
.course p { max-width: 62ch; margin: 0 auto 14px; text-align: left; }
.course .go { padding: 9px 20px; border: 0; border-radius: 99px; background: var(--pink); color: #fff; font: 700 12px var(--head); letter-spacing: .04em; }
.course .go:hover { filter: brightness(.95); }
.course[data-c="0"] h2 { color: var(--pink-d); }
.course[data-c="1"] h2 { color: var(--blue-d); }
.course[data-c="2"] h2 { color: var(--green-d); }
.course[data-c="3"] h2 { color: var(--violet-d); }
</style>
<!-- Tabs -->
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="false" data-t="writing">WRITING</button>
    <button class="tab" role="tab" aria-selected="true" data-t="interactives">INTERACTIVES</button>
    <span class="sp"></span>
    <button class="round" aria-label="Switch tab" id="flip">‹</button>
    <button class="round x" aria-label="Close">✕</button>
  </div>

  <div class="wrap">

    <!-- Writing tab -->
    <section id="writing" class="hidden">
      <p class="crumb">Courses</p>
      <div class="courses" id="courses"></div>
    </section>

    <!-- Interactives tab -->
    <section id="interactives">

      <div class="games">
        <button class="game" aria-pressed="false" data-g="quiz"><h3 class="fun">Quiz</h3>Test what you learned. Pick a deck, Types of Research or Do’s and Don’ts in Research Writing, and see your score at the end.</button>
        <button class="game" aria-pressed="true" data-g="activity"><h3 class="fun">Activity</h3>Write your research paper section by section. Follow the guided steps and type your draft beside them.</button>
      </div>

      <!-- Activities accordion -->
      <div class="win" id="activities">
        <div class="wbar">
          <h2>ACTIVITIES</h2>
          <button class="round" id="a-prev" aria-label="Collapse all">‹</button>
          <button class="round x" id="a-close" aria-label="Close activities">✕</button>
        </div>
        <div class="wbody"><ul class="acc" id="acc"></ul></div>
      </div>

      <!-- Quiz deck -->
      <section class="deck hidden" id="quiz" aria-label="Quiz deck">
        <div class="decks" id="decks" role="group" aria-label="Choose a deck"></div>
        <div class="deckhead">
          <div>
            <h2 class="fun" id="deck-title">Research Time!</h2>
            <p class="deck-sub" id="deck-sub"></p>
          </div>
          <button class="studybtn" id="study-btn">Study deck</button>
        </div>
        <div id="materials">
          <h3 class="cardsh" id="cards-h"></h3>
          <div id="cards"></div>
        </div>
        <div id="study" class="hidden" aria-live="polite"></div>
      </section>

      <!-- Step viewer -->
      <div class="viewer hidden" id="viewer" aria-live="polite">
        <div class="wbar">
          <h2 id="v-title"></h2>
          <span class="pill" id="v-done"></span>
          <button class="round" id="v-prev" aria-label="Previous stage" title="Previous stage">‹</button>
          <button class="round" id="v-next" aria-label="Next stage" title="Next stage">›</button>
          <button class="round x" id="v-close" aria-label="Close">✕</button>
        </div>
        <div class="vgrid">
          <div class="steps" id="steps"></div>
          <div class="writewrap">
            <textarea class="write" id="write" placeholder="TYPE HERE..." aria-label="Writing area"></textarea>
            <button class="copybtn" id="copy" type="button" aria-label="Copy text" title="Copy text">
              <svg id="copy-ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
            </button>
            <button class="copybtn clearbtn" id="clear" type="button" aria-label="Clear all text" title="Clear all text">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/><path d="M10 11v6M14 11v6"/></svg>
            </button>
            <span class="copied hidden" id="copied" role="status">Copied!</span>
          </div>
        </div>
      </div>

    </section>
  </div>

  <!-- Delete confirmation -->
  <div class="modal hidden" id="confirm" role="alertdialog" aria-modal="true" aria-labelledby="c-t" aria-describedby="c-d">
    <div class="mbox">
      <h3 id="c-t">Delete text?</h3>
      <p id="c-d">Are you sure you want to delete the text? This cannot be brought back.</p>
      <div class="mrow">
        <button class="ghost" id="c-no" type="button">No, keep it</button>
        <button class="studybtn" id="c-yes" type="button">Yes, delete</button>
      </div>
    </div>
  </div>
  <!-- Course complete -->
  <div class="modal hidden" id="congrats" role="alertdialog" aria-modal="true" aria-describedby="g-d">
    <div class="mbox cong">
      <p id="g-d">Congratulations for completing the Writing Course! You are now ready to write your Research Paper, goodluck!</p>
      <div class="mrow"><button class="studybtn" id="g-ok" type="button">Close</button></div>
    </div>
  </div>
<script>
/* =====================================================
   Helpers
   ===================================================== */
const $  = (s) => document.querySelector(s);
const $$ = (s) => [...document.querySelectorAll(s)];

const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const load = (key) => { try { return JSON.parse(localStorage.getItem(key) || '{}'); } catch (e) { return {}; } };
const persist = (key, value) => { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {} };

/* =====================================================
   Data
   page = [step, ...]
   step = [title, ...blocks]

const INFO = {"Introduction Writing": [{"b": ["The background of a study is the opening section of a research paper or thesis that establishes what is already known about the topic, identifies what remains unknown, and explains why the current study is needed. It provides readers with enough context to understand the research problem without requiring them to read every source the author consulted. A well-written background moves from broad context to a specific gap, setting up the research question or hypothesis that follows.", ["The background of a study establishes context, synthesizes relevant literature, identifies the research gap, and justifies the need for the current study.", "It differs from a literature review (which is comprehensive and standalone) and from an introduction (which is broader and includes the research question and objectives).", "An effective background follows a funnel structure: broad field context narrows to specific gaps and then to the study purpose.", "Synthesizing sources rather than summarizing them individually is the single most important writing technique for this section.", "Common mistakes include listing studies without connecting them, making the background too broad, and failing to state the gap explicitly."]], "ref": ["Lombard, C. (2026, September 7). How to write the background of a study: (Steps + Examples). Paperguide Blog. https://paperguide.ai/blog/write-background-of-a-study/"], "ex": ["Dengue, similar to most diseases in tropical countries such as the Philippines, is a viral infection transmitted by being bitten by dengue infected mosquitoes. Due to the high mosquito population in tropical regions, countries like the Philippines experience annual outbreaks–usually in summer times. According to Statista (2024), the Philippines recorded an approximate number of 225,500 dengue cases. Similarly, Dengue-induced thrombocytopenia is a disease known for its symptom of lowering an individual’s platelet count, which is crucial for blood clotting. According to NIH (2022) Dengue-induced thrombocytopenia, a significant reduction in platelet count, is a common complication of dengue fever. MayoClinic (2025) further explains that thrombocytopenia results in excessive bruising, superficial bleeding under the skin, prolonged bleeding from cuts, gumbleeds, nosebleeds, etc. with some cases being fatal.", "With this prior knowledge in hand, the researchers seek the potential of using mangosteen peels and moringa leaves as key components in producing platelet-enhancing food supplements for treating Dengue-induced Thrombocytopenia. In addition to this, the researchers would be exploiting the raw materials’ nutritional value in order to produce a medicinal product. The researchers are also driven by the desire to produce a cost-efficient, shelf-stable, and effective platelet-enhancing food supplement. The outcome of the research is not expected to replace the whole treatment process of dengue, instead, may only play a role in treating dengue patients.", "Moringa leaves known locally as “Malunggay” is a ‘power food’ widely cultivated in the Philippines due to its general potential and herbal purposes. Moringa plant is also known for being versatile and easy to grow. With this, a globally NIH estimation (n.d) stated that the moringa market is substantial and growing, with an estimated value of $6.7 billion in 2020 and a projected compound annual growth rate (CAGR) of 8.2%. According to Food Science and Human Wellness (2016), every part of M. oleifera is a storehouse of important nutrients and antinutrients. The leaves of M. oleifera are rich in minerals like calcium, vitamins A and C and iron, among many others. These contents are found to have been effective in alleviating the symptoms of dengue virus and enhancing platelet production. In order to attain the nutritional contents of the moringa leaves, the researchers would be drying the material. This process removes the water contents of the leaves and the minerals, vitamins, proteins, and phytochemicals remain in the dried material. This makes per-gram nutrient content appear higher in dried leaves (2016).", "Mangosteen, specifically Garcinia mangostana is a tropical fruit that has been used in the Philippines traditionally. The popularity of this fruit came from its nutritional value, like its iron contents and many others, causing it to become considered for its medicinal purposes. In addition to this, the entirety of the fruit offers health benefits. As a matter of fact, extracts are found to contain antioxidants like xanthones. In addition to this, it also has Vitamin C, Vitamin B and many others, preventing or slowing damage to cells, protecting platelets from getting damaged and encouraging production. Thus showing its potential as a component in producing a platelet-enhancing product. Since the fruit is seasonal, the researchers found that drying the peels is an effective preservation technique. When water is removed during hot-air drying (50–60 °C), heat-stable compounds like minerals, phenolics, and xanthones become more concentrated per gram of dried peel (Saini et al., 2021).", "The final product produced by the study would use raw materials such as mangosteen peels and moringa leaves. With that, the study is expected to aid public markets who sell both mangosteen peels and moringa leaves. In addition to this, although advances have been made to treat and alleviate symptoms of dengue, they are known to be lengthy and pricey. A.I.A. (2024) reported that, in the Philippines, the average cost of treating a dengue patient in a private hospital is PHP 43,000, while the average cost in a public hospital is PHP 21,900. Due to this, the study would also help Dengue patients by lessening the economical burden of treating the disease. It is also worth noting that any positive findings from the study would enable aspirers to produce similar products. Last but not least, the findings of this study would serve as stepping stones for future researchers.", "Through the different recognized chemical compounds found in both the moringa leaves and mangosteen peels, the researchers are going to test its general efficacy as a platelet-enhancing supplement through an online platform for accurate assessments. Following this, the study would determine which among the prepared frequencies of consumption would yield the most promising results in terms of platelet enhancement, the cost-effectiveness of the product, and lastly, the significant differences of changing the ratios to be consumed by the test subjects in order to assess its overall quality."]}, {"b": ["It is the argument for why the study needs to exist: it names a gap in current knowledge or practice, explains why that gap matters, and states what the study will do to close it. A rationale is not a restatement of the topic (“this study looks at X”) and it is not a list of the researcher’s personal interests — it is a reasoned case, built on evidence from the existing literature, that this particular question is worth the time, money, and participant burden it will cost to answer.", "The rationale opens a study by justifying why it needs to happen; the discussion section’s implications close it by explaining what the findings actually mean once the study is done. They are structurally mirror images of each other, and a weakness in one often signals a weakness in the other — a study whose rationale overpromises tends to produce a discussion that overstates its implications to match.", ["What is already known? — the established territory, summarized from the literature.", "What is missing, wrong, or untested? — the gap, stated precisely enough that a reader could recognize it if they saw it filled.", "Why does filling it matter, and why now? — the significance: the theoretical, clinical, practical, or policy consequence of leaving the gap unaddressed."], "A rationale is not the same thing as a research question or a hypothesis — those state what will be asked or predicted; the rationale is the argument for why that question is the right one to ask. It is also not a literature review in miniature: a literature review surveys a body of work; a rationale uses a targeted slice of that same literature in service of a single argumentative claim, that this specific gap exists and matters."], "ref": ["CASRAI. (2026, August 4). The rationale of a study: what it is and how to write one. https://casrai.org/guides/rationale-of-a-study"], "ex": ["CDC (2022) noted that the Dengue virus is a disease that affects the lives of many. In some cases of dengue, symptoms worsen and become life-threatening and still have detrimental effects on one’s health and wellbeing. According to MayoClinic (2024), many people experience no signs or symptoms of a dengue infection. When symptoms do occur, they may be mistaken for other illnesses—such as flu—and usually begin four to 10 days after you are bitten by an infected mosquito, making the disease notorious in tropical countries. Although advances have been made to treat and alleviate symptoms of dengue, they are known to be lengthy and pricey. A.I.A. (2024) reported that, in the Philippines, the average cost of treating a dengue patient in a private hospital is PHP 43,000, while the average cost in a public hospital is PHP 21,900. Because of this, locals tend to rely on herbal medicine such as the tawa-tawa tea to treat dengue. Although some researchers deemed this process to be safe, some still doubt its safety towards alleviating dengue symptoms.", "The Moringa industry in the Philippines has grown significantly as research and development efforts have focused on this crop. Moringa plant is also known for being versatile and easy to grow. R.Colins (2015) noted that the moringa plant is an all-year round, which grows in warm wet areas. Moringa leaves are found to be rich in different vitamins, namely A, C, Iron, and other anti-inflammatory properties. These contents are found to have been effective in alleviating the symptoms of dengue virus and enhancing platelet production. Similarly, Healthline (2024) proved that mangosteen includes similar contents, having vitamins C, B9, B1, B2, and other antioxidants. Although this certain fruit is seasonal, many ways to preserve its properties are surfacing.", "Due to the potential of each raw material in enhancing platelet production and alleviating dengue-induced thrombocytopenia, researchers at Marikina Science High School strive to explore the efficacy and cost-effectiveness of Moringa leaves and Mangosteen peels in dengue treatment development. At the end of the experiment, the output is to be observed and analyzed according to its effectiveness with the help of in silico testing and proper interpretation methods.", "The outcome of the research is not expected to replace the whole treatment process of dengue, it only reveals any hidden potentials of the mixture to aid the treatment of Dengue. In addition, the research supports the local economy and local entrepreneurs because all of the raw materials will be bought locally. The utilization of mangosteen peels can also reduce the wastes produced by mangosteen.", "Herbal plants such as the moringa plant are consumed in many ways in order to utilize its nutritional properties to its fullest potential, yet researchers disagree with using it for medicinal purposes specifically dengue induced-thrombocytopenia. Despite the advances in ways of preservation of mangosteen, they are still regarded as seasonal fruits and are hard to access when it’s out of season. Improper extraction of the beneficial properties of both plants are expected due to lack of experience about proper extraction is also a challenge to be faced by the researchers."]}, {"b": ["A literature review is a survey of scholarly sources on a specific topic. It provides an overview of current knowledge, allowing you to identify relevant theories, methods, and gaps in the existing research that you can later apply to your paper, thesis, or dissertation topic.", "The literature review gives you a chance to:", ["Demonstrate your familiarity with the topic and its scholarly context", "Develop a theoretical framework and methodology for your research", "Position your work in relation to other researchers and theorists", "Show how your research addresses a gap or contributes to a debate", "Evaluate the current state of research and demonstrate your knowledge of the scholarly debates around your topic."], "A good literature review doesn’t just summarize sources—it analyzes, synthesizes, and critically evaluates to give a clear picture of the state of knowledge on the subject."], "ref": ["McCombes, S. (2025, January 22). How to Write a Literature Review | Guide, Examples, & Templates. Scribbr. Retrieved November 5, 2026, from https://www.scribbr.com/dissertation/literature-review/"], "ex": [{"h": "Corn Cobs"}, "Gandam, P. K., Chinta, M. L., Gandham, A. P., Pabbathi, N. P. P., Konakanchi, S., Bhavanam, A., Atchuta, S. R., Baadhe, R. R., & Bhatia, R. K. (2022). A new insight into the composition and physical characteristics of Corncob—Substantiating its potential for tailored biorefinery objectives. Fermentation, 8(12), 704. https://doi.org/10.3390/fermentation8120704", "In this article written by Gandam, P. K., Chinta, M. L., Gandham, A. P., Pabbathi, N. P. P., Konakanchi, S., Bhavanam, A., Atchuta, S. R., Baadhe, R. R., & Bhatia, R. K. (2022), it was mentioned that the structural utility of agricultural residues such as corncobs and coconut husk is fundamentally determined by their chemical composition. Their analysis reveals that while both sections of the corncobs are rich in carbohydrates, the outer portions possess significantly higher lignin content and thermal stability. It was also found that Corn Cob had high lignin/cellulose content, low thermal conductivity, low density and high porosity characteristics.", {"h": "Corn Cob as Particle Board"}, "Abetie, D. (2021). Particle board production from maize cob. ResearchGate. https://d1wqtxts1xzle7.cloudfront.net/88482570/particle-board-production-from-maize-cob-libre.pdf", "According to Abetie (2021), maize cobs are an abundant agricultural byproduct that are often discarded or underutilized, which contributes to environmental waste. Corn cobs have properties that make them suitable for particleboard production, including low density, availability, and ease of processing. The study highlights that while corn cob particleboards show potential as sustainable alternatives to wood-based boards, their water resistance is poor, making them prone to swelling and reduced durability when exposed to moisture. Mechanical strength and consistency are also challenges that need further improvement. Overall, the study concludes that corn cob is a promising raw material for eco-friendly board production, but enhancing water resistance and durability is essential for practical applications.", {"h": "Corn Cob as Fiberboard"}, "Irwan, Y., Hurahman, A. P., & Amanullah, M. N. (2025). Utilization of corn cob waste as composite board (fiberboard) which will be used as soundproof walls. Jurnal Teknik Mesin, 14(2), 137–142. https://doi.org/10.22441/jtm.v14i2.33537", "According to Irwan, Y., Hurahman, A. P., & Amanullah, M. N. (2025). Corn cobs are a significant byproduct of corn farming. When left unmanaged, they are often discarded in rivers or left to rot, causing pollution and unpleasant odors. Corn Cobs exhibit several advantageous properties such as small particle size, favorable mechanical strength, dimensional stability, a robust surface texture, and high compressive resistance. The study concludes that corn cob waste is a viable raw material for creating functional, eco-friendly soundproofing panels. While the mechanical strength and water resistance require further optimization, the acoustic properties are highly effective for noise reduction applications.", {"h": "Corn Husk as Cork Board"}, "Antarroza, A. (2024). Corn husk as corkboard. Scribd. https://www.scribd.com/document/731391633/Corn-Husk-as-Corkboard", "The article written by Antarroza, A. (2024), focused on addressing the environmental and economic costs of commercial corkboards by utilizing agricultural waste. Corn husks are highlighted as a potential raw material due to their high cellulose content and fibrous texture, which can be bonded together to create a surface suitable for pinning. It also explored using cornstarch as a binder. It further explained that Cornstarch is composed of two polymers: amylose and amylopectin. In its raw, powder form, it has no adhesive properties. To turn it into a binder, it must undergo gelatinization. This allows the cornstarch to form a paste-like viscous gel substance which allows the fibers to be bonded together."]}, {"b": ["A problem statement is a concise, evidence-based description of a specific gap or difficulty that a research study will address. It appears early in a proposal, dissertation, or journal article and answers 3 questions: what is unknown or debated, why this gap should be filled, and how the present study will address it. A problem statement does more than describe a topic. It converts a broad interest into a defensible case for action by pairing observed facts with a documented shortfall in existing knowledge.", ["A problem statement is a short, evidence-backed description of a specific gap your study will address; it is not a topic, a research question, or a hypothesis.", "Strong statements contain 5 parts: the ideal state, the actual state, supporting evidence, the consequences of inaction, and a proposed response.", "Discipline shapes emphasis: education research foregrounds learning outcomes, nursing research foregrounds patient safety, and business research foregrounds cost and competitive risk.", "Most problem statements run 150-300 words and appear in the opening pages of a proposal, in chapter 1 of a thesis, or in the final third of a journal introduction."], "A problem statement matters because it justifies the entire study: reviewers use it to judge whether the work is needed, feasible, and worth funding. A weak statement signals that the researcher has not yet found a defensible gap.", "Your problem statement performs several jobs at once:", ["Establishes significance by showing scale, cost, or risk in measurable terms", "Sets boundaries by naming the population, setting, and time frame", "Anchors the research questions, so every question traces back to a stated gap", "Guides method selection, since the nature of the gap suggests the appropriate design", "Supplies the criteria reviewers apply later when judging whether the study delivered"]], "ref": ["Rodrigues, M. (2026, September 22). How to write a problem statement in Research: Definition and examples. Educational Articles for Researchers, Students and Authors - EditageBlog. https://www.editage.com/blog/how-to-write-a-problem-statement-in-research-definition-and-examples/"], "ex": ["1. Are there any significant differences in the effectiveness of the moringa leaves and mangosteen peels among the prepared proportions?", "2. Will the frequency of the consumption affect the efficacy of moringa leaves and mangosteen peels as a platelet enhancing food supplement?", "3. Is there a significant difference in the cost-efficiency among the different proportions of moringa leaves and mangosteen peels used in the food supplement?"]}, {"b": ["A hypothesis is a statement that can be tested by scientific research. If you want to test a relationship between two or more variables, you need to write hypotheses before you start your experiment or data collection.", "A hypothesis states your predictions about what your research will find. It is a tentative answer to your research question that has not yet been tested. For some research projects, you might have to write several hypotheses that address different aspects of your research question.", "A hypothesis is not just a guess – it should be based on existing theories and knowledge. It also has to be testable, which means you can support or refute it through scientific research methods (such as experiments, observations and statistical analysis of data). Hypotheses propose a relationship between two or more types of variables.", ["An independent variable is something the researcher changes or controls.", "A dependent variable is something the researcher observes and measures."], "If there are any control variables, extraneous variables, or confounding variables, be sure to jot those down as you go to minimize the chances that research bias will affect your results."], "ref": ["McCombes, S. (2025, January 16). How to Write a Strong Hypothesis | Steps & Examples. Scribbr. Retrieved November 4, 2026, from https://www.scribbr.com/methodology/hypothesis/"], "ex": ["**Hypothesis 1:** There are no significant differences in the effectiveness of moringa leaves and mangosteen peels among the prepared proportions as a platelet-enhancing food supplement.", "**Hypothesis 2:** There are significant differences in the effectiveness of moringa leaves and mangosteen peels among the prepared proportions as a platelet-enhancing food supplement.", "**Hypothesis 3:** The frequency of consumption of platelet-enhancing food supplements made from moringa leaves and mangosteen peels has no significant effect on the product’s efficacy.", "**Hypothesis 4:** The frequency of consumption of platelet-enhancing food supplements made from moringa leaves and mangosteen peels has a significant effect on the product’s efficacy.", "**Hypothesis 5:** There are no significant differences in the cost-efficiency among the different prepared proportions of moringa leaves and mangosteen peels as platelet enhancing food supplements.", "**Hypothesis 6:** There are significant differences in the cost-efficiency among the different proportions of moringa leaves and mangosteen peels as platelet enhancing food supplements."]}, {"b": ["The significance of the study is a short, persuasive passage, usually one to three paragraphs, that answers a single question your examiner is always asking: so what? It states the contribution your work makes to knowledge, practice, policy or a particular community, and it names the people or groups who stand to gain from the results. In most UK dissertations it appears near the end of Chapter 1 (Introduction), immediately after your research aims and objectives and before the structure of the dissertation.", "Crucially, the significance of the study is a forward-looking, value statement. It is not a summary of what you did, nor a list of your methods. It argues that the answers your study will produce are worth having, and it does so before you have collected a single data point. A strong significance section gives the reader a reason to keep reading and gives the examiner a clear yardstick: by the end of the thesis, did the study deliver the value it promised?", ["It justifies the time, cost and ethical burden of the research, which matters most when human participants or scarce funding are involved.", "It positions your work against the existing literature, showing that you understand the field well enough to see what is missing, which is also where a strong set of research aims takes shape.", "It guides your own decisions, because a clear sense of who benefits keeps your aims, methods and recommendations focused on real-world value."]], "ref": ["Mae, A. (2026, October 26). Significance of the study: How to write it (Examples). ResearchProspect. https://www.researchprospect.com/significance-of-the-study/"], "ex": ["This study is helpful to consumers since Cork Boards made from Corn Cob and Coconut Husk are cheaper than commercialized Cork Boards. It will serve the same purpose with the usual cork board but it is more affordable and cost effective. Additionally, since both are made from eco-friendly recycled materials, disposal is easier of the cork board after use.", "Since Corn Cob and Coconut Husk are considered as agricultural waste, utilizing them as alternatives for cork boards will help the environment to lessen its waste production. Using these materials will reduce the need for harvest of cork trees.", "Since Corn Cob and Coconut husk are often considered waste materials, agricultural communities can repurpose them into valuable products like cork boards, generating extra income. This helps create job opportunities and stimulate local economies by establishing new industries in rural areas. Additionally, using these byproducts supports sustainable farming practices and waste reduction efforts.", "Since Corn Cob and Coconut husk are low-cost raw materials, manufacturers can produce cork boards at a reduced cost, leading to more affordable pricing. These sustainable products allow manufactures to offer eco-friendly products, appealing to consumers who are environmentally conscious. This shift also contributes to reducing agricultural waste, promoting a circular economy, and fostering innovation in sustainable manufacturing processes.", "As the study aims to create a more affordable product alternative to cork boards, this results in economic growth. The supply of coconut husk and corn cob are from corn and coconut. The manufacturing of corn cob and coconut husk as an alternative component of cork board depends on the harvest of coconut and corn. This results in less waste that may negatively impact the environment.", "This research contributes to the economic and environmental field of research. Cork boards help in a variety of ways. For example, as an organizer. As this research aims for sustainability, utilization of wastes like corn cob and coconut husk are implemented. Future researchers benefit from this study through providing an overview of the existing knowledge about coconut husk and corn cobs as an alternative for cork boards such as its properties and benefits."]}, {"b": ["The scope of the study is a concise statement of the extent and boundaries of your research. It answers a single question your reader is always asking: “What, exactly, is this study about — and what is it not about?” In practice, the scope sets out the parameters within which your investigation operates: the topic and research questions, the target population or sample, the geographic and temporal limits, the variables or concepts examined, and the methodological approach used to study them.", "Think of the scope as drawing a fence around your research. Everything inside the fence is what you promise to deliver and defend. Everything outside it is acknowledged as relevant but explicitly excluded, usually for reasons of time, resources, feasibility or focus. Defining that fence is not a sign of a small or weak project — it is a sign of a disciplined one. A study that claims to cover everything ends up covering nothing convincingly.", "The scope appears most often in the introduction or methodology chapter of a dissertation, and as a standalone heading in a research proposal. Examiners read it early because it frames how they will judge everything that follows: a finding that would be a weakness in a broad study can be entirely appropriate in a tightly scoped one.", {"h": "Scope vs. Delimitations vs. Limitation vs. Significance"}, "The cleanest way to remember the difference: scope is the boundary, delimitations are the choices that drew the boundary where it is, limitations are the things that weaken results despite your best efforts, and significance is the argument for why the bounded study is worth doing at all. The constraints you could not control are explored in depth in our guide to the limitations of the study; read it alongside this one so the two sections do not contradict each other.", "A complete scope statement typically addresses six dimensions. You will not always need all six, but running through the checklist ensures nothing important is left vague.", ["Topic and research questions — the precise phenomenon, concept or relationship under investigation, stated narrowly rather than broadly.", "Population and sample — who or what is being studied: the people, organisations, documents or cases, and how many.", "Geographic boundary — the location, region, institution or setting in which the research takes place.", "Time frame — the period the study covers (the years of data, or the window of data collection).", "Variables or concepts — the specific factors, themes or constructs examined, and any deliberately set aside.", "Methodology — the broad approach (qualitative, quantitative or mixed) and the type of data used, which itself bounds what the study can claim; the research methodology chapter then explains these choices in full."], "Each dimension you specify simultaneously creates a delimitation — a boundary you chose. That is why the two sections are written together. The scope says “here is the fence”; the delimitations say “here is why I put it there.”"], "ref": ["Mae, A. (2026a, June 19). Scope of the study: How to write it (+ examples). ResearchProspect. https://www.researchprospect.com/scope-of-the-study/"], "ex": ["Our study focuses on evaluating the feasibility of using corn cob and coconut husk as alternative materials to cork boards, specifically in applications like bulletin boards. The research will be tested in a non-standardized testing, where the physical properties of these materials, such as lightweightness, durability, and impermeability, will be tested and compared to traditional cork boards in terms of cost-effectiveness and functionality. It will also assess the environmental impact of these materials, including their sustainability. However, the study is limited to the experimental phase and will not extend to full-scale commercial production. Only corn cob and coconut husk will be considered, excluding other potential alternatives, and the testing will focus on the materials’ durability by the means of non-standardized testings ( Durability (Compression and Impact test), Lightweightness, and Impermeability - resistance to moisture(Humidity Testing)). The study will also focus on specific uses like bulletin boards and acoustic panels, not covering other applications of cork boards.", "Although this project is promising and includes the needed testing to prove its effectiveness, there are still some gaps that the researchers faced due to lack of financial resources, incompetence, and time constraints. The researchers agreed in the first place to test the insulation and abrasion-resistance property of Cork Boards since Corn Cob and Coconut Husk are fibers that excel in insulation of heat with a low thermal conductivity. But due to some factors including the costing of the laboratory testing and its convenience, they agreed to not test it anyway. They have also agreed to compromise other testing (Taber Abrasion and Water Absorption) to match the capabilities of the researchers."]}, {"b": ["The engineering design process is a series of steps that engineers follow to come up with a solution to a problem.", "Many times the solution to a problem involves designing a product (like a machine or computer code) that meets certain criteria and/or accomplishes a certain task. This process is different from the Steps of the Scientific Method, which you may be more familiar with. If your project involves making observations and doing experiments, you should probably follow the Scientific Method. If your project involves designing, building, and testing something, you should probably follow the Engineering Design Process. If you still are not sure which process to follow, you should read Comparing the Engineering Design Process and the Scientific Method.", {"img": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAeIAAAIdCAIAAABup+mlAAAACXBIWXMAAAsSAAALEgHS3X78AAAgAElEQVR42uzdd5wc1Zkv/Kdydc7d0xN6Qk/WKEtISIgooom2wWDstXHEG+6+m+zdu3d32X3f9d1rr+3rjfbuAgZ acteristics of relevant compounds recognized from each raw material (i.e. mangosteen peel and moringa leaves). The process of obtaining the Simplified Molecular Input Line Entry System (SMILES) would result in more convenient testing and generally easier assessment. This will enable researchers to determine the possible effects of the platelet-enhancing food supplements to subjects.", "A one-way analysis of variance (ANOVA) will be utilized by the researchers to determine statistical differences between the three ratios:", {"table": [["REPLICATES", "Mangosteen Peels", "Moringa Leaves"], ["A", "70%", "30%"], ["B", "50%", "50%"], ["C", "30%", "70%"]], "cap": "Table 1."}, {"table": [["Consumption Frequency (a day)", "RATIO A", "RATIO B", "RATIO C", "UNTREATED"], ["1x", "Test 1", "Test 4", "Test 7", "Test 10"], ["2x", "Test 2", "Test 5", "Test 8", "Test 11"], ["3x", "Test 3", "Test 6", "Test 9", "Test 12"]], "cap": "Table 2."}]}, {"b": [["Identifying Hazards: Researchers list all inherent dangers in their study—such as toxic chemicals in a lab, high-voltage equipment, or probing questions about trauma in a survey.", "Assessing and Managing Risk: Researchers evaluate the probability that a participant or researcher will be harmed by the hazard and how severe that harm could be. They then apply hazard controls (such as protective gear, data encryption, or counseling referrals) to lower the risk.", "Minimal Risk: In human subjects research, Defining Risk is often measured against “minimal risk,” meaning the probability and magnitude of harm are no greater than what people experience in daily life or routine medical/psychological tests."]], "ref": ["American Chemical Society. (2014). Identifying and evaluating hazards in research laboratories. American Chemical Society Joint Board-Council Committee on Chemical Safety. acs.org", "National Research Council. (2000). Strategies to reduce sodium intake in the United States [Appendix D: Understanding hazards and risks]. National Academies Press. nih.gov", "U.S. Department of Health and Human Services, Office of Research Integrity. (n.d.). Chapter 3: The protection of human subjects: IRBs. hhs.gov", "University of Virginia Institutional Review Board for Health Sciences Research. (n.d.). Defining risk. University of Virginia Human Research Protection Program. virginia.edu"], "ex": ["The accomplishment of the study of coconut husk and corn cob as alternative components to cork board has potential risk and hazards. These risks and hazards include chemical, physical, and technical. While conducting the study, as the properties of coconut husk and corn cob states that both coconut husk and corn cob produce high lignin content, inhalation or absorption of the dust can result in eye and throat irritation. The procedures of manufacturing the product can cause harm to the researchers by unintentionally injuries such as body pain. The machine that will help manufacture the product can also put researchers in danger when malfunctioned. They might also experience cuts when dealing with the fibers."]}, {"b": ["Definition of Terms in research is the section where you explain the exact meaning of important terms used in your study. In a thesis or dissertation, it often appears in Chapter 1 after the background, problem statement, research questions, or scope of the study.", "Use this section to define:", ["Technical terms that readers may not know", "Variables used in your study", "Operational definitions, or how a concept is measured in your research", "Terms that have a specific meaning in your thesis"], "The Definition of Terms (also called “Definition of Key Terms” or “Operational Definitions”) is a section in academic papers where researchers explicitly define specialized, technical, or ambiguous terms used throughout their study. According to research writing best practices, this section establishes a shared understanding between the researcher and the audience by explicitly stating how particular terms will be used within the specific context of the research."], "ref": ["ConceptViz. (2026, January 22). Definition of Terms in Research: Examples + Chapter 1 format. ConceptViz. https://conceptviz.app/blog/definition-of-terms-in-research-complete-guide"], "ex": [{"h": "A. Variables"}, "**Corn Cob**", ["The hard core in the center of a corn which holds kernels together.", "Possess operative properties including high lignin content, antimicrobial, and antioxidants which is used as a component and creation of materials for several purposes such as construction."], "**Coconut Husk**", ["The outer shell of the coconut.", "Also called coconut fibre or coir as it has natural fiber.", "Due to high cellulose content, coconut husk has a potential as a renewable resource that can construct various materials."], "**Durability**", ["Refer to the material’s lasting effect and enduring over time.", "Used to test the product’s physical functions when facing challenges when used."], "**Feasibility**", ["The potential that something can be successful.", "Analyzes the succession and practicality of the study to help determine the plan of the project by evaluating factors affecting the study."], {"h": "B. Process"}, "**Corn Cobs**", ["The central, woody part of a corn ear, which is dried, crushed, and used as a primary material in making the cork board."], "**Coconut Husk**", ["The fibrous outer layer of a coconut, processed into small fibers and mixed with corn cobs to add durability to the cork board."], "**Binder (Corn Starch)**", ["An adhesive substance used to combine the crushed corn cobs and coconut husk fibers into a solid form."], "**Grinding/Crushing**", ["The process of breaking down the corn cobs and coconut husk into smaller particles to create a smooth and compact board."], "**Drying**", ["The process of removing moisture from the mixture by exposing it to sunlight or low heat to harden the board."], {"h": "C. Testing"}, "**Compression and Impact test**", ["To test the durability of the cork board by compressing and adding intense impact to it.", "Stimulates damage to the cork board."], "**Humidity Testing**", ["To test for its impermeability, resistance to moisture.", "A method to assess how the cork board reacts to such humidity levels"]]}], "Methodology Writing": [{"b": ["It is a three-column model used in research studies in order to visualize and better understand the systems, processes, and projects of the methodology of the study. Based on the given name, it breaks down the system into three main parts: Input, Process, and Output.", ["**Input**: This includes every raw material or variable that enters the system or will be utilized in the process to create the desired output.", "**Process**: It is the part where the inputs are transformed into outputs. Every process done in order to perform the said transformation must be listed to provide an overview of information as to how the inputs were processed.", "**Output**: This is where the finished product, services, or outcomes are written that resulted from the inputs undergoing a certain process."], "This structure typically looks like this:", {"img": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wAARCAFYApsDASIAAhEBAxEB/8QAHAABAQACAwEBAAAAAAAAAAAAAAcFBgIECAMB/8QAVxAAAAQDAQcOCwcCBQEHBQEAAAECAwQFBhEHEhchMTbRExQWMkFRVFVzdJKTsbIVIjVTYXGBg5GU0jM0oaPBwsNS4QgYI0JysyQlN2JkgvAnQ0Vj8UT/xAAbAQEAAgMBAQAAAAAAAAAAAAAABQYCAwQBB//EAD8RAAECAwIJCgYDAAEEAwAAAAEAAgMEEQUhFTE0UVNxkbHRBhITFBYzQYGh4TJSYXKiwSKy8DVCYpLxJYLC/9oADAMBAAIRAxEAPwD1SNKuh1NMpAqBKXPIa1XVL++bJVtl7Zl9ZjdRNLrX20t95+0bpcAxACoy2Ij4cm9zDQ3YtYWEwj1Lw1rqE6AwjVLwxrqE6BlrnFOyqdwca5MINEQpt1KUmozKwr23cMbhsBprilrpr0jqfEhMdzS1QErJ2jMQhFZGuP8A3FTnCNUvDGuoToDCNUvDGuoToFG2A01xS1016Q2A01xS1016Rj08H5fQLowVaen/ACdwU5wjVLwxrqE6AwjVLwxrqE6BRtgNNcUtdNekNgNNcUtd q/i031SnkFX8Wm+qUGvLdwZ0zbmappmMmfQalLTUUfJrIMEn7mRzHnHIz0wF3WzhpLT1TKi6auv168npZaOkZVFjWwNkZsc4hgHaO28suyr75BV/FpvqlPIKv4tN9UoKPo7QNw0eyhpI9Z3mutdFGYordUQQNi24OBua3dyJz1VxXf5BV/FpvqlPIKv4tN9UoLDa/8Aq+D5Kylj25jo6GFr2lrg3mD1CyEBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREBERAREQEREH//2Q==", "alt": "Process flow chart of the cork board study: preparing the fibers, drying, weighing and categorizing per set-up, preparing equipment, making, compressing and drying the cork board, then humidity, lightweightness, compression and impact testing, and data collection through ANOVA, Kruskal-Wallis test and coefficient of variance."}]}, {"b": ["This section presents a list of materials and equipment used in the research study. It includes, but not limited to, measuring tools, scientific instruments, physical, biological and test subjects, and data collection software. It is advisable to group the items by category or list them in chronological order as to how they appear in the procedure.", "The materials and equipment section is necessary to directly establish the validity, credibility and reproducibility of the study as it provides clear evidence on what was used and how it is used in producing the results of the study."], "ref": [], "ex": [{"h": "I. Materials and Equipments"}, "**MATERIALS:**", ["Coconut Husk (fibers) — 2kg - price varies since some may be gathered through recycling (approx. 47 pesos for 1kg)", "Corn Cob (fibers) — 2kg - gathered through recycling", "Corn Starch (Binder) — 3kg - price varies", "Sandpaper — 60-100 grit, 10 pcs", "Fiberboard Molder — 3 pcs 25 by 27 cm molder"], "**Proportions** - each 5 by 3 inches cork board should weigh 250 grams (fibers only)", ["SET-UP A: 25% Corn Cob (62.5 g) - 75 % Coconut Husk (127.5 g)", "SET-UP B: 50% Corn Cob (125 g) - 50% Coconut Husk (125 g)", "SET-UP C: 75% Corn Cob (187.5 g) - 25% Coconut Husk (62.5g)"], "**EQUIPMENTS:**", ["Blender/Food processor", "Bowls", "Scale", "Measuring Tape", "Rubber Scraper"]]}, {"b": ["In this part of the methodology, it presents a detailed chronological procedure of how the study was conducted from start to finish. It explains the exact order of events, from preparation to finish, and specifies how the variables were involved. Furthermore, it presents how the data was collected and the environmental and contextual information on when the study was conducted.", "This section aims to provide transparency and reproducibility, providing specific, granular information that helps other researchers understand and/or replicate the conducted study."], "ref": [], "ex": [{"h": "I. Preparation of Materials"}, "**A. Gathering of Raw Materials**", "The researchers would be buying the powderized moringa leaves prior to the research experimentation. The researchers would collect at least 315g of fresh mangosteen peels. Additionally, the researchers would prepare the necessary tools in order to process the powderized moringa leaves and mangosteen peels.", "**B. Preparation of Mangosteen peels and Moringa Leaves**", "The mangosteen peel and moringa leaves would be oven-dried for at least 3 hours at 75°C to ensure that it’s brittle and dried. An exact amount of 21g of mangosteen peels would be transferred to a glass bowl.", "**C. Encapsulation of Ratio A**", "84 capsules will be prepared—each capsule will contain 175 mg powderized mangosteen peel and 75 mg powderized moringa leaves.", "**D. Encapsulation of Ratio B**", "84 capsules will be prepared—each capsule will contain 175 mg powderized moringa Leaves and 75 mg powderized mangosteen peels.", "**E. Encapsulation of Ratio C**", "84 capsules will be prepared—each capsule will contain 125 mg powderized moringa Leaves and 125 mg powderized mangosteen peels."]}, {"b": ["This section provides information as to how changes in one variable, setting, or configuration affects the overall performance or outcome. Furthermore, it helps in identifying the best or applicable combinations or synthesis of variables in order to produce the desired results. Moreover, this also aids in identifying whether the setup created would remain stable and reliable under varying conditions. Executing various testing for the created setup would provide more reliable and accurate evidence or data to support the claims provided in the research paper."], "ref": [], "ex": ["**A. SMILES**", "The SMILES of the compounds acknowledged are to be put under online assessments done with ADMED3.0. The app would help give sufficient data to assess the different variables to be measured.", "**B. Administration of Food Supplements**", ["Test 1, Test 4, and Test 7 would consume ratio a, ratio b, and ratio c respectively once per day in the span of 14 days.", "Test 2, Test 5, and Test 8 would consume ratio a, ratio b, and ratio c respectively once per day in the span of 14 days.", "Test 3, Test 6, and Test 9 would consume ratio a, ratio b, and ratio c respectively once per day in the span of 14 days.", "Test 10, 11, and 12 would not receive any food supplements."]]}, {"b": ["This section provides a comprehensive blueprint for explaining how numerical data are used, organized, and transformed in creating a meaningful conclusion. This details both descriptive and inferential statistics to summarize characteristics and test hypotheses in order to establish relationships between variables.", "The discussion of statistical treatment aids in establishing objectivity, replicability, and validity of the research paper."], "ref": [], "ex": ["The researchers would be producing a total of 3 cork boards. (3 setups) The researchers will be following the same experiments and procedures for each setup, while having different proportions (Set-ups A, B, and C)", "**A. Collecting of Results**", "Tests and results will be collected by the researchers after each testing in all set-ups (A, B, and C) for 3 trials each to ensure fair and credible testing.", "**B. Statistical Treatment**", "The One-way Analysis of Variance (ANOVA), Kruskal-Wallis Test and Dispersion Analysis will be used to administer a non-standardized test in order to assess the data and observations gathered in the experiment."]}], "Results Writing": [{"b": ["The results section of a research paper transforms raw data into structured and comprehensive findings that addresses the established research questions of the study. It presents the statistical or thematic data objectively without subjective interpretation. It provides an impartial overview of the actual findings.", "It is significant as it provides objective results and evidence necessary to validate or reject the study’s hypotheses. It serves as the foundation of the paper in ensuring that all subsequent claims remain credible. Without this, it would be difficult for the readers to fully comprehend and believe to the credibility of the whole study."], "ref": []}], "Discussion Writing": [{"b": ["This is where you wrap up your ideas and leave the reader with a strong final impression. It has several key goals:", ["Restate the problem statement addressed in the paper", "Summarize your overall arguments or findings", "Suggest the key takeaways from your paper"], "It must summarize the main findings, study’s significance, and propose future directions. Instead of simply restating your introduction, you must synthesize your arguments into a final, cohesive takeaway for the reader."], "ref": ["Caulfield, J. (2023, April 13). Writing a Research Paper Conclusion | Step-by-Step Guide. Scribbr. Retrieved November 2, 2026, from https://www.scribbr.com/research-paper/research-paper-conclusion/"], "ex": ["The in-silico assessment showed that different moringa-mangosteen formulations produced different platelet enhancement results which showed their distinct effects on platelet estimation. The balanced 50:50 ratio produced the highest platelet improvement index which proves that ingredient ratios determine how well the supplement works. The results show that Hypothesis 1 has been disproven while Hypothesis 2 receives support because different formulation ratios produce different effectiveness results.", "The study found that participants showed better predicted platelet outcomes when they consumed more supplements with the strongest results occurring at two to three supplements daily. The results show that treatment effectiveness depends on how often patients consume the medication which leads to the rejection of Hypothesis 3 and the confirmation of Hypothesis 4.", "The in-silico study did not assess cost-efficiency directly but the findings indicate that the 50:50 ratio provides optimal value because it develops and protects platelet production. The research findings establish a foundation for future cost-effectiveness studies which will evaluate Hypotheses 5 and 6. The study demonstrates that the 50:50 moringa-mangosteen blend which people should take as two to three daily supplements represents the best option for testing through in vivo studies as a supplement that raises platelet levels."]}, {"b": ["It is a concise, factual synthesis of a research study’s primary results wherein it directly answers the core research questions or objectives of the study without adding new data, personal opinions, or deep interpretations. Additionally, it also provides closure, bridging the gap between the raw data chapter and the final analytical takeaways. This includes", ["Brief methodology recap.", "Chronological or structured results", "Factual tone."], "It must summarize the main findings, study’s significance, and propose future directions. Instead of simply restating your introduction, you must synthesize your arguments into a final, cohesive takeaway for the reader."], "ref": ["Client challenge. (n.d.). https://www.scribd.com/document/449535342/SUMMARY-OF-FINDINGS#google_vignette"], "ex": ["The focus of our study was to determine the feasibility of using corn cob and coconut as alternative components for cork boards, specifically evaluating their durability, lightweightness, and impermeability. By testing these specific ratios—Set-up A (25:75), Set-up B (50:50), and Set-up C (75:25)— if they could serve as a substitute for cork. While the project successfully produced a board from local waste, the transition from using raw materials to an actual product revealed significant and aesthetic problems.", "Since the testing was non-standardized, the results are a representation of a research-led testing. In terms of physical weight, the study found a clear difference between the three experimental groups. During our compression and impact tests, Set-up A was the most successful with a weight of 695g. In contrast, Set-up B was the heaviest at 848g, followed up by Set-up C at 713g. During the tests, Set-up A showed the best resilience, maintaining its form under pressure compared to Set-up C which was made up of mostly corn cob. However, high humidity levels were recorded across all of the samples, showing that the fibers kept a significant amount of moisture regardless of the ratio.", "The statistical analysis for moisture resistance (One-way ANOVA) showed a p-value of 0.058, and (Kruskal-Wallis Test) showed a p-value of 0.1150, which led to a failure to reject the null hypothesis. This indicates that there was no statistically significant difference in how all ratios resisted humidity. Despite this, the internal moisture most probably contributed to the poor results the boards received during testing, since the weight also remained far from the usually commercialized cork boards.", "The survey of 50 participants highlighted a clear difference between the results and consumer standards. While the researchers were able to reduce the weight in Set-up A compared to the other two, its mass is nearly six times heavier than a standard 19cm x 26cm commercial cork board, usually weighing only 70g to 120g. This basically led to 90% of the respondents to reject the board’s lightweightness and functionality. Additionally, 100% of the participants were also dissatisfied with its appearance.", "Lastly, the findings suggest that even though corn cobs and coconut husks are strong enough to create a board, the researcher’s non-standardized creation crosses resulted in a product that is too dense, keeps in too much moisture, and lacks visual appeal. While 40% of the survey participants recognized the material’s durability, 60% felt that it did not meet their standards for a functional cork board. For this waste-based alternative to be truly usable, future development should focus more on an effective grinding and drying process, so that it would be closer to the weight and appearance of commercially produced cork boards."]}, {"b": ["Recommendations for future research should be:", ["Concrete and specific", "Supported with a clear rationale", "Directly connected to your research"], "Overall, strive to highlight ways other researchers can reproduce or replicate your results to draw further conclusions, and suggest different directions that future research can take, if applicable.", "Relatedly, when making these recommendations, avoid:", ["Undermining your own work, but rather offer suggestions on how future studies can build upon it", "Suggesting recommendations actually needed to complete your argument, but rather ensure that your research stands alone on its own merits", "Using recommendations as a place for self-criticism, but rather as a natural extension point for your work"], "Follow the formula to set up your recommendation: Research Question -> Conclusion -> Recommendation.", {"h": "How it should be written"}, "As a rule of thumb, try to limit yourself to only the most relevant future recommendations: ones that stem directly from your work. While you can have multiple recommendations for each research conclusion, it is also acceptable to have one recommendation that is connected to more than one conclusion.", "These recommendations should be targeted at your audience, specifically toward peers or colleagues in your field that work on similar subjects to your paper. They can flow directly from any limitations you found while conducting your work, offering concrete and actionable possibilities for how future research can build on anything that your own work was unable to address at the time of your writing."], "ref": ["George, T. (2023, July 18). How to Write Recommendations in Research | Examples & Tips. Scribbr. Retrieved November 2, 2026, from https://www.scribbr.com/dissertation/recommendations-in-research/"], "ex": ["The following recommendations are offered as possible ways to improve this study and to help other researchers studying the field of Corn Cob, Coconut Husk and Cork board.", "Corn Cobs should be dried out completely before using it as a component for your study. Drying it under the sun is the most effective way to do so. Corn cobs included so much water content in them and skipping out the drying process would trigger mold infestation. In this study, the researchers dried the corn cobs under the sun for 3 days. Although it was dry when it was used during the experimentation process, there are numerous molds visible. Set up C had the most mold growth since it had more corn cob content. This event also matches the results of table 2 and 3 which showed that Set up C had the most humidity content. A high moisture content means that mold growth is more likely to happen.", "Researchers should consider the varying environmental humidity during curing. This change may greatly affect the moisture content of the cork board. Additionally, it may greatly affect the drying process.", "Researchers should maintain a uniform fiber particle size throughout the study to ensure consistent and accurate results in the Research. This also allows the product to be more appealing for the public market.", "Researchers should find a better alternative environmentally-friendly binder. The study utilized cornstarch and water mixture as a binder which made the cork board have a soft yet compact structure. Adjusting the cornstarch to water ratio may also improve the results of your cork board. The study used a 1:2 ratio which has a watery-paste consistency.", "Researchers should probe a stronger foundation in Cork boards. Assessing its importance and qualities. Although Corn Cob and Coconut Husk were promising based on their chemical properties, the results of this research is promising but needs further improvements.", "Researchers should have a bigger sample size to ensure that the statistical treatment would be credible enough. The findings of the statistical treatments in this study resulted in a failure to reject the null hypothesis due to a small sample size. The outcomes of each trial for testing were considered to be random “noises” and were not sufficient enough to be considered as evidence to accept nor reject the null hypothesis."]}, {"b": ["A bibliography is a listing of the books, magazines, and Internet sources that you use in designing, carrying out, and understanding your science fair project.", "Your bibliography should include a minimum of three written sources of information about your topic from books, encyclopedias, and periodicals. You may have additional information from the Web if appropriate.", "When you are writing your report, you will use the sources in your bibliography to remind you of different facts and background information you used for your science fair project. Each time you use some information from a source, you will need to cite the source that it came from. To cite a source, simply put the author’s name and the date of the publication in parentheses (Author, date) in your text. If the person reading your report wants to find the information and read more about it, they can look up the reference in your bibliography for more detail about the
